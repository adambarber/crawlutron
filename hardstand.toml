# hardstand workspace configuration for crawlutron
#
# Workspaces are created inside .hardstand/ (gitignored), on branches prefixed
# with "work/". The base branch is main.

[workspace]
base_branch = "main"

[env]
# Setup children receive the declared keys and NOTHING ambient (Injection is a
# complete environment, hardstand#398 diagnosis): without PATH, pre-commit's
# internal `git` calls fail with "git failed. Is it installed". The leading
# relative entry puts the workspace's venv first (PATH entries resolve against
# the child's CWD = the workspace), so tool-resolution via shutil.which and
# bare `python`/`git` find the venv's tools (#557).
PATH = ".venv/bin:/usr/bin:/bin:/usr/local/bin:/opt/homebrew/bin"

[[resource]]
kind          = "worktree"
provider      = "git.worktree"
branch_prefix = "work"

# The env namespace axis: present so [env] keys resolve (validation refused
# PATH with only git.worktree — "no adapter resolves this key").
[[resource]]
kind     = "env"
provider = "env.namespace"

# Setup: reuse the main checkout's existing venv via symlink — no downloads.
# The main checkout already has a working .venv with all dev deps installed.

[[setup]]
name = "link-venv"
run = "ln -sfn ../../.venv .venv"

[[setup]]
name = "regen-version"
run = ".venv/bin/python -m pip install -e . --no-deps --quiet"

# Setup, part 2 (#488): bind the WORKSPACE tree into the shared venv's sys.path.
#
# The shared venv carries hatchling editable installs whose .pth files point at
# the MAIN checkout (/Users/.../crawlutron). From the workspace CWD that pointer
# is shadowed (sys.path[0] = '' wins), so in-workspace mypy/pytest/ruff all see
# the workspace tree. But any interpreter of the shared venv invoked from OUTSIDE
# the workspace resolved `app` to MAIN's tree via the editable pointer — red:
# `import app` from a foreign CWD printed main's path. Fix, zero downloads, no
# main clobbering: site-packages processes .pth files alphabetically and appends
# each path to sys.path in that order, so a pth whose name sorts BEFORE
# `_editable_impl_crawlutron.pth` (ASCII '!' < '_') lands the workspace tree
# earlier in sys.path — workspace-first from any CWD. Stale pths after teardown
# are harmless: paths that no longer exist are skipped by site processing.

[[setup]]
name = "bind-workspace-tree"
run = "printf %s $PWD > .venv/lib/python3.12/site-packages/!hardstand-workspace.pth"

# #553 residual: a fresh workspace's git hooks do not exist until pre-commit
# installs them -- without this step a workspace commit runs ZERO gates and
# still looks green. Installs both stages explicitly (pre-commit install alone
# covers only pre-commit, not commit-msg).

[[setup]]
name = "install-git-hooks"
run = ".venv/bin/pre-commit install --hook-type commit-msg --hook-type pre-commit"

# Actions that agents can run inside the workspace

[[actions]]
name = "pytest"
kind = "exec"
env = ["PATH"]
timeout = 90s
run = ".venv/bin/python -m pytest"

[[actions]]
name = "pytest-fast"
kind = "exec"
env = ["PATH"]
timeout = 90s
run = ".venv/bin/python -m pytest -q"

[[actions]]
name = "ruff"
kind = "exec"
env = ["PATH"]
timeout = 30s
run = ".venv/bin/ruff check"

[[actions]]
name = "mypy"
kind = "exec"
env = ["PATH"]
timeout = 60s
run = ".venv/bin/mypy"

[[actions]]
name = "pre-commit"
kind = "exec"
env = ["PATH"]
timeout = 90s
run = ".venv/bin/pre-commit run --all-files"

[[actions]]
name = "lint"
kind = "exec"
env = ["PATH"]
timeout = 60s
run = ".venv/bin/make lint"

[[actions]]
name = "typecheck"
kind = "exec"
env = ["PATH"]
timeout = 60s
run = ".venv/bin/make typecheck"

[[actions]]
name = "basedpyright"
kind = "exec"
env = ["PATH"]
timeout = 60s
run = ".venv/bin/basedpyright --pythonpath .venv/bin/python"

[[actions]]
name = "shell"
kind = "exec"
run = "bash"
