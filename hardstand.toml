# hardstand workspace configuration for crawlutron
#
# Workspaces are created inside .hardstand/ (gitignored), on branches prefixed
# with "work/". The base branch is main.

[workspace]
base_branch = "main"

[env]
# Setup children receive the declared keys and NOTHING ambient (Injection is a
# complete environment, hardstand#398 diagnosis): without PATH, pre-commit's
# internal `git` calls fail with "git failed. Is it installed". The leading
# relative entry puts the workspace's venv first (PATH entries resolve against
# the child's CWD = the workspace), so tool-resolution via shutil.which and
# bare `python`/`git` find the venv's tools (#557).
PATH = ".venv/bin:/usr/bin:/bin:/usr/local/bin:/opt/homebrew/bin"
# Workspace source packages first so hardstand exec/run resolves the workspace
# tree, not the shared venv's editable install pointing at the main checkout.
PYTHONPATH = "packages/core/src:packages/mcp/src:packages/rest/src:packages/safe-url/src:packages/sdk/src"

[[resource]]
kind          = "worktree"
provider      = "git.worktree"
branch_prefix = "work"

# The env namespace axis: present so [env] keys resolve (validation refused
# PATH with only git.worktree — "no adapter resolves this key").
[[resource]]
kind     = "env"
provider = "env.namespace"

# Setup: reuse the main checkout's existing venv via symlink — no downloads.
# The main checkout already has a working .venv with all dev deps installed.

[[setup]]
name = "link-venv"
run = "ln -sfn ../../.venv .venv"

# Setup, part 2 (#488, corrected #1058): bind the WORKSPACE tree into the shared
# venv's sys.path.
#
# The shared venv carries hatchling editable installs whose .pth files point at
# the MAIN checkout (/Users/.../crawlutron) and win over the workspace CWD, so an
# interpreter started in a workspace imported MAIN's packages: ad-hoc pytest
# verified the wrong tree. Fix, zero downloads, no main clobbering: site-packages
# processes .pth files alphabetically and appends each path to sys.path in that
# order, so a pth whose name sorts BEFORE `_editable_impl_crawlutron.pth`
# (ASCII '!' < '_') lands the workspace roots earlier in sys.path. The roots are
# the members' src/ dirs, derived from the uv manifest by the binder; binding the
# workspace ROOT (the old printf) exposed nothing importable. Stale pths after
# teardown are harmless: paths that no longer exist are skipped by site.

[[setup]]
name = "bind-workspace-tree"
run = ".venv/bin/python scripts/bind_workspace_tree.py"

# #553 residual: a fresh workspace's git hooks do not exist until pre-commit
# installs them -- without this step a workspace commit runs ZERO gates and
# still looks green. Installs both stages explicitly (pre-commit install alone
# covers only pre-commit, not commit-msg).

[[setup]]
name = "install-git-hooks"
run = ".venv/bin/pre-commit install --hook-type commit-msg --hook-type pre-commit"

# Actions that agents can run inside the workspace

# #1213: `hardstand exec` inherits the executor's 30s default, shorter than the
# battery's warm ~34s, so a gated commit is killed before the admission test finishes.
# This declared action carries its own 120s bound and still runs EVERY hook; the
# message is read from .git/ so no tracking artifact or .gitignore surface is added.
[[actions]]
name = "commit"
kind = "exec"
env = ["PATH", "PYTHONPATH"]
timeout = "120s"
run = 'git commit -F "$(git rev-parse --git-dir)/commit-message"'

[[actions]]
name = "pytest"
kind = "exec"
env = ["PATH", "PYTHONPATH"]
timeout = "120s"

run = ".venv/bin/python -m pytest"

[[actions]]
name = "pytest-fast"
kind = "exec"
env = ["PATH", "PYTHONPATH"]

run = ".venv/bin/python -m pytest -q"

[[actions]]
name = "ruff"
kind = "exec"
env = ["PATH", "PYTHONPATH"]
timeout = "30s"
run = ".venv/bin/ruff check"

[[actions]]
name = "mypy"
kind = "exec"
env = ["PATH", "PYTHONPATH"]
timeout = "60s"
run = ".venv/bin/mypy"

[[actions]]
name = "pre-commit"
kind = "exec"
env = ["PATH", "PYTHONPATH"]
timeout = "90s"
run = ".venv/bin/pre-commit run --all-files"

[[actions]]
name = "pre-push"
kind = "exec"
env = ["PATH", "PYTHONPATH"]
timeout = "120s"
run = ".venv/bin/pre-commit run --all-files --hook-stage pre-push"

[[actions]]
name = "lint"
kind = "exec"
env = ["PATH", "PYTHONPATH"]
timeout = "60s"
run = ".venv/bin/make lint"

[[actions]]
name = "typecheck"
kind = "exec"
env = ["PATH", "PYTHONPATH"]
timeout = "60s"
run = ".venv/bin/python -m mypy"

[[actions]]
name = "basedpyright"
kind = "exec"
env = ["PATH", "PYTHONPATH"]
timeout = "60s"
run = ".venv/bin/basedpyright --pythonpath .venv/bin/python"

[[actions]]
name = "shell"
kind = "exec"
run = "bash"
