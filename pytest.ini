[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Default run is fast and hermetic: real-browser and slow/integration tests are
# opt-in via -m browser / -m slow (or run the whole suite with -o addopts="").
# This keeps "pytest" green, quick, and order-independent by default.
#
# Parallel by default, because a fast suite that is only fast when someone
# remembers a flag is not fast. Serially this suite was 68.9s; the AST property
# detectors in particular walk every module, which is the kind of work that
# parallelises almost perfectly. `-n auto` rather than a fixed count because the
# right number is the machine's, and a number tuned on one laptop is wrong on
# every other. `worksteal` rather than the default `load` because the suite is
# dominated by a handful of very slow detector tests: `load` hands each worker a
# fixed slice and a worker that draws the slow ones finishes long after the rest,
# while `worksteal` moves finished work to whoever is still busy.
#
# For a single test, or while debugging, `-p no:xdist` turns it back off -- the
# per-worker startup is real, and a one-test run does not amortise it.
addopts = --strict-markers -m "not browser and not slow and not structural" -n auto --dist worksteal
markers =
    browser: launches a real headless browser (Camoufox/Playwright); slow and environment-dependent. Skipped by default.
    slow: takes noticeably longer than the fast default (large fixtures, real servers, many iterations). Skipped by default.
    integration: exercises cross-module behavior against real servers.
    real_cffi: exercises the real curl_cffi TLS-impersonation fetcher (opt-out of the autouse test stub).
    real_sleeps: keeps time.sleep/asyncio.sleep real for timing-true bound tests (opt-out of fast_sleeps).
    structural: asserts on app/ source SYNTAX rather than runtime behavior (tests/invariants/ and the ratchet layer). Skipped by default; run with `pytest -m structural` or `make test-all` so the behavioral suite stands alone.
filterwarnings =
    error
    ignore::ResourceWarning
