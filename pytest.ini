[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --strict-markers
# Keep warnings-as-errors strictness, but silence two categories that fire from
# third-party socket/coroutine cleanup (httpx keep-alive sockets against the
# in-process test server, camoufox internals). Their PytestUnraisableException-
# Warning form was failing randomly-attributed unrelated tests.
filterwarnings =
    error
    ignore::ResourceWarning
    ignore:coroutine .* was never awaited:RuntimeWarning
# pytest-randomly auto-enables when installed; --randomly-seed=N to reproduce
