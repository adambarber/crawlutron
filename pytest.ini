[pytest]
asyncio_mode = auto
# pytest-asyncio >=1.2: the async-fixture event-loop scope must be declared
# explicitly or the plugin errors at configure. "function" is both the future
# default and what this suite's function-scoped async fixtures/tests assume --
# one fresh loop per test, declared to silence the deprecation.
asyncio_default_fixture_loop_scope = function
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Default run is fast and hermetic: real-browser and slow/integration tests are
# opt-in via -m browser / -m slow (or run the whole suite with -o addopts="").
# This keeps "pytest" green, quick, and order-independent by default.
#
# Structural tests (tests/invariants/) are INCLUDED by default (2026-10-27):
# after the parse-cache and fan-out optimizations the structural set adds
# ~6s wall under `-n auto` (44.7s vs 43.3s) — cheap enough that the gate
# surface belongs in every battery run, not only in the pre-commit hook.
#
# Parallel by default, because a fast suite that is only fast when someone
# remembers a flag is not fast. Serially this suite was 68.9s; the AST property
# detectors in particular walk every module, which is the kind of work that
# parallelises almost perfectly. `-n 4` (owner directive 2026-11-10): multiple
# agents run batteries concurrently and `-n auto` saturates every core, making
# the owner's machine unusable; 4 workers keep the suite fast while leaving
# headroom. `worksteal` rather than the default `load` because the suite is
# dominated by a handful of very slow detector tests: `load` hands each worker a
# fixed slice and a worker that draws the slow ones finishes long after the rest,
# while `worksteal` moves finished work to whoever is still busy.
#
# For a single test, or while debugging, `-p no:xdist` turns it back off -- the
# per-worker startup is real, and a one-test run does not amortise it.
addopts = --strict-markers -m "browser_battery or not (browser or slow or real_pbkdf2)" -n 4 --dist worksteal
markers =
    browser: launches a real headless browser (Camoufox/Playwright); slow and environment-dependent. Skipped by default.
    browser_battery: a browser engine-integration test that runs IN the default commit battery, guarded by the browser_available() skipif (binary present -> runs; absent -> skips).
    slow: takes noticeably longer than the fast default (large fixtures, real servers, many iterations). Skipped by default.
    real_cffi: exercises the real curl_cffi TLS-impersonation fetcher (opt-out of the autouse test stub).
    real_sleeps: keeps time.sleep/asyncio.sleep real for timing-true bound tests (opt-out of fast_sleeps).
    real_pbkdf2: exercises the real 210k-iteration PBKDF2 path (opt-out of the autouse iteration clamp). Skipped by default.
    wall_assertion: the test asserts on ELAPSED wall time (perf_counter/time.time read then compared) -- the sanctioned spelling of the flake-seed class.
    structural: asserts on app/ source SYNTAX rather than runtime behavior (tests/invariants/ and the ratchet layer). Informational: included by default in every battery run; filter with `pytest -m 'not structural'` to exclude it.
filterwarnings =
    error
# Warning-zero ratchet (#643): the ONLY filter is `error` itself. Every warning
# class is either eliminated structurally (ResourceWarning sources closed; the
# deferred-close declines are a recorded state, not a log) or fails the run.
# An `ignore::` row here is a suppressor -- the zero-warning gate forbids it.
# Global hard timeout (owner directive 2026-11-06): a red run against a
# hang/spin defect must FAIL naming file+line, never hang. Only the owner
# authorizes an increase, including any per-test override above this.
timeout = 120
