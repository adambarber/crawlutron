[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Default run is fast and hermetic: real-browser and slow/integration tests are
# opt-in via -m browser / -m slow (or run the whole suite with -o addopts="").
# This keeps "pytest" green, quick, and order-independent by default.
addopts = --strict-markers -m "not browser and not slow"
markers =
    browser: launches a real headless browser (Camoufox/Playwright); slow and environment-dependent. Skipped by default.
    slow: takes noticeably longer than the fast default (large fixtures, real servers, many iterations). Skipped by default.
    integration: exercises cross-module behavior against real servers.
    real_cffi: exercises the real curl_cffi TLS-impersonation fetcher (opt-out of the autouse test stub).
filterwarnings =
    error
    ignore::ResourceWarning
    ignore:coroutine .* was never awaited:RuntimeWarning
