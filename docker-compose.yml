# Default-deny egress topology (production): app on internal network with
# loopback-only published port, sidecar proxy is the sole dual-homed container
# (internal + egress). This is the production-default architecture.
#
# Run with: docker compose up -d
# For local development: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
# For runtime proof test: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d

services:
  # The application container: on internal network for proxy communication,
  # with loopback-only published port for host access and healthcheck.
  # All egress must go through the sidecar proxy.
  crawlutron:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: crawlutron:local
    container_name: crawlutron
    restart: unless-stopped
    init: true
    mem_limit: 3g
    ports:
      # Bind to loopback only; the service has no caller authentication by
      # design and must not be exposed to the network without a reverse
      # proxy in front of it.
      - "127.0.0.1:8765:8765"
    environment:
      CRAWLUTRON_HOST: "0.0.0.0"
      CRAWLUTRON_LOG_LEVEL: "info"
      CRAWLUTRON_WORKERS: "1"
      CRAWLUTRON_CACHE_DIR: "/app/cache"
      CRAWLUTRON_LOG_FILE: "/app/logs/crawlutron.jsonl"
      CRAWLUTRON_CONTENT_CACHE_ENABLED: "true"
      CRAWLUTRON_ALLOW_PRIVATE_TARGETS: "0"
      CRAWLUTRON_SEARCH_PROVIDER: "auto"
      CRAWLUTRON_TAVILY_API_KEY: "${CRAWLUTRON_TAVILY_API_KEY:-}"
      CRAWLUTRON_KEY_ADMIN_TOKEN: "${CRAWLUTRON_KEY_ADMIN_TOKEN:-}"
      # Point to sidecar proxy for all egress
      CRAWLUTRON_EGRESS_PROXY_URL: "http://egress-proxy:8888"
    volumes:
      - ./logs:/app/logs
      - ./cache:/app/cache
    networks:
      - internal
    extra_hosts:
      - "mobile.events.data.microsoft.com:0.0.0.0"
      - "browser.events.data.microsoft.com:0.0.0.0"
      - "default.events.data.microsoft.com:0.0.0.0"
      - "settings-win.data.microsoft.com:0.0.0.0"
      - "dc.services.visualstudio.com:0.0.0.0"
      - "rt.services.visualstudio.com:0.0.0.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    depends_on:
      - egress-proxy

  # Sidecar egress proxy: the ONLY dual-homed container.
  # Attached to both internal (for app) and egress (for outbound) networks.
  # Runs the crawlutron egress proxy providing admission, DNS pinning,
  # and logical-identity guarantee.
  egress-proxy:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: crawlutron:egress-proxy
    container_name: egress-proxy
    restart: "no"
    init: true
    mem_limit: 512m
    command: ["python", "/app/scripts/egress_proxy_sidecar.py"]
    environment:
      EGRESS_PROXY_BIND_HOST: "0.0.0.0"
      EGRESS_PROXY_BIND_PORT: "8888"
    networks:
      - internal
      - egress

networks:
  # Internal network: app <-> proxy only. No internet access.
  internal:
    driver: bridge
    internal: true
  # Egress network: proxy <-> external only. Has internet access via host.
  egress:
    driver: bridge
    internal: false