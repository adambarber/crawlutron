coverage:
  status:
    project:
      default:
        target: auto
        threshold: 0.5%
        informational: true
    patch:
      default:
        target: 90%
        informational: true

# Six Codecov components for per-surface measurement:
# - battery: the fast suite (commit admission)
# - real-pbkdf2: real PBKDF2 stress surface
# - test-browser: browser integration surface
# - admission: admission package coverage
# - crawl: crawl package coverage
# - sdk: SDK package coverage
# All components use carryforward so a surface absent on a given run does not
# crater the total. Status targets remain informational; no blocking threshold.
component_management:
  default_rules:
    carryforward: true
  individual_components:
    battery:
      flag_regexes:
        - battery
      carryforward: true
    real-pbkdf2:
      flag_regexes:
        - real-pbkdf2
      carryforward: true
    test-browser:
      flag_regexes:
        - test-browser
      carryforward: true
    admission:
      paths:
        - packages/crawlutron-admit/src/crawlutron_admit/
      carryforward: true
    crawl:
      paths:
        - packages/core/src/crawlutron/
      carryforward: true
    sdk:
      paths:
        - packages/sdk/src/crawlutron_sdk/
      carryforward: true

# Informational status per component; no gate fails on coverage.
# Each component's project/patch status inherits the global informational setting.