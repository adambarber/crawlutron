# Test override for docker-compose.yml: adds isolated origin for runtime proof.
# This simulates an external target that can ONLY be reached via the proxy.
#
# Run with: docker compose -f docker-compose.yml -f docker-compose.test.yml up -d

services:
  # Isolated origin: only on egress network, not reachable from internal.
  # Uses a test-only HTTP fixture that returns a unique success marker AND the received Host header.
  origin:
    build:
      context: .
      dockerfile: Dockerfile
      target: test-origin
    restart: "no"
    networks:
      - egress
    # Mount the test fixture read-only
    volumes:
      - ./tests/ci/fixtures:/app/fixtures:ro

  # Override proxy to allow private targets for the test origin.
  # This is a named test-topology exception; production keeps secure default.
  egress-proxy:
    environment:
      CRAWLUTRON_ALLOW_PRIVATE_TARGETS: "1"
    depends_on:
      - origin