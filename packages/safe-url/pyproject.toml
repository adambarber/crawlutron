[build-system]
requires = ["hatchling", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "crawlutron-safe-url"
dynamic = ["version"]
description = "SSRF-safe URL admission: NormalizedUrl, HostPolicy, IDNA canonicalization, registrable domain, private-target guard, credential-safe redaction"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = []

[project.optional-dependencies]
# The bounded matcher (safe_url/safe_regex.py) is the ``regex`` C extension:
# only consumers that call scope_allows/compile_untrusted need it.
regex = ["regex==2026.9.29"]
# The public-suffix dataset (safe_url/registrable_domain.py): without it the
# two-label heuristic answers site grouping, explicitly via psl_available().
psl = ["publicsuffixlist==1.1.2.20261101"]
full = ["regex==2026.9.29", "publicsuffixlist==1.1.2.20261101"]

[tool.hatch.version]
source = "vcs"
raw-options = { search_parent_directories = true }

[tool.hatch.build.targets.wheel]
packages = ["src/safe_url"]