[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawlutron-safe-url"
version = "0.5.0"
description = "SSRF-safe URL admission: NormalizedUrl, HostPolicy, IDNA canonicalization, registrable domain, private-target guard, credential-safe redaction"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "regex==2026.11.9",
    "publicsuffixlist==1.1.2.20261101",
]

[tool.hatch.build.targets.wheel]
packages = ["src/safe_url"]