[build-system]
requires = ["hatchling", "hatch-vcs>=0.4.0.dev0"]
build-backend = "hatchling.build"

[project]
name = "crawlutron-extract"
dynamic = ["version"]
description = "Stdlib-only content extraction: HTML, office containers, text formats, PDF tier 1, bounded and deterministic"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"

# Stdlib only except crawlutron-safe-url for link admission (slice 5).
# pdfminer.six is declared as an optional extra and imported lazily (slice 8).
dependencies = ["crawlutron-safe-url"]

[project.optional-dependencies]
pdf-fallback = ["pdfminer.six"]

[tool.hatch.version]
source = "vcs"
raw-options = { search_parent_directories = true }

[tool.hatch.build.hooks.vcs]
version-file = "src/crawlutron_extract/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crawlutron_extract"]
