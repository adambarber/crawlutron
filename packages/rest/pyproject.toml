[build-system]
requires = ["hatchling", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "crawlutron-rest"
dynamic = ["version"]
description = "FastAPI HTTP surface for the policy-driven web crawler and content-extraction service"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "crawler",
    "scraper",
    "fastapi",
    "browser",
    "ssrf-protection",
    "extraction",
]
dependencies = [
    # rest is the FastAPI-carrying package; core is framework-free and never
    # imports this wheel. The floor is the first release that shipped the
    # disjoint api/main/cli surface under packages/rest (Wave A, #900/#902).
    "crawlutron-core>=0.4",
    "fastapi==0.162.0",
]

[project.scripts]
# The crawler CLI ships with the REST surface it talks to (a thin HTTP client
# forwarding to the service). It moved here with the api/main surface in #902.
crawl = "crawlutron_rest.cli.__main__:main"

[tool.hatch.version]
source = "vcs"
raw-options = { search_parent_directories = true }

[tool.hatch.build.targets.wheel]
packages = ["crawlutron_rest"]