[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawlutron-mcp"
version = "0.5.0"
description = "Transport-agnostic Model Context Protocol (2026-07-28) surface for the Crawlutron crawler"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    # mcp is framework-free at the source layer; it consumes core's engine, so
    # its install closure includes core's runtime stack. rest (the FastAPI
    # carrier) depends on this wheel, never the reverse.
    "crawlutron-core>=0.4.0.dev0",
    "pydantic",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crawlutron_mcp"]

[tool.uv.sources]
# Resolve the sibling wheel from the workspace, not PyPI: core is a member of
# this workspace and its version is git-derived at build time.
crawlutron-core = { workspace = true }