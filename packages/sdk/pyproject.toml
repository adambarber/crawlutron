[build-system]
requires = ["hatchling", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "crawlutron-sdk"
dynamic = ["version"]
description = "Python client for the Crawlutron execution service"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "httpx",
    "pydantic",
]

[tool.hatch.version]
source = "vcs"
raw-options = { search_parent_directories = true }

[tool.hatch.build.targets.wheel]
packages = ["src/crawlutron_sdk"]