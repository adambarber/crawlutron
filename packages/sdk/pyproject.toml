[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawlutron-sdk"
version = "0.5.0"
description = "Python client for the Crawlutron execution service"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "httpx",
    "pydantic",
]

[tool.hatch.build.targets.wheel]
packages = ["src/crawlutron_sdk"]