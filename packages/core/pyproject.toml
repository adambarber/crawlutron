[build-system]
requires = ["hatchling", "hatch-vcs>=0.4.0.dev0"]
build-backend = "hatchling.build"

[project]
name = "crawlutron-core"
dynamic = ["version"]
description = "Policy-driven, self-hosted web crawler and content-extraction service built around FastAPI"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"

# The engine's own runtime set: every third-party library the `crawlutron` and
# `admission` packages import. Declaring it here is what makes `pip install
# crawlutron-core` produce a working engine instead of an import error; the app
# wheel depends on the members and adds nothing.
dependencies = [
    "crawlutron-safe-url>=0.4.0.dev0",
    "fastapi==0.162.0",
    "camoufox==0.5.9",
    "curl_cffi==0.17.0",
    "trafilatura==2.3.1",
    "markitdown[pdf,docx,pptx,xlsx]==0.1.9",
    "pdfplumber==0.11.10",
    "charset-normalizer==3.5.2",
    "h2==4.4.1",
    "httpx==0.28.1",
    "brotli==1.2.1",
    "lxml==6.1.3",
    "beautifulsoup4==4.15.0",
    "markdownify==1.2.3",
    "pydantic==2.14.2",
    # Local DBAPI schema migrations only; no network or telemetry behavior.
    "yoyo-migrations==9.0.0",
    # CVE-2026-126190: soupsieve < 4.0.0; pinned so the audit gate and the lock agree.
    "soupsieve==4.0.0",
]

[tool.hatch.version]
# The single source of the version: the most recent git tag (SemVer). Untagged
# or dirty checkouts get a dev suffix; no hand-edited number. This member lives
# under packages/core, a subdirectory of the shared git repository, so the VCS
# source searches parent directories to find the workspace root's history.
source = "vcs"
raw-options = { search_parent_directories = true }

[tool.hatch.build.hooks.vcs]
# Written at build/editable-install time; regenerated, never committed. The path
# follows the src layout the member adopted in #945.
version-file = "src/crawlutron/_version.py"

[tool.hatch.build.targets.wheel]
# Dist name (crawlutron-core) and import names (crawlutron, admission) are
# independent: importing either resolves into this one wheel.
packages = ["src/crawlutron", "src/admission"]