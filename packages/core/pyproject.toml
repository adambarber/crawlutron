[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crawlutron-core"
version = "0.5.0"
description = "Policy-driven, self-hosted web crawler and content-extraction service built around FastAPI"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"

# The engine's own runtime set: every third-party library the `crawlutron` and
# `admission` packages import. Declaring it here is what makes `pip install
# crawlutron-core` produce a working engine instead of an import error; the app
# wheel depends on the members and adds nothing.
dependencies = [
    # crawlutron-extract is the extraction leaf: its bounded DOM parsers and the
    # selector validators crawl_policy's field validators call. Declared here so a
    # plain `pip install crawlutron-core` cannot lose the import the manifest does
    # not grant (workspace resolution masks the defect locally).
    "crawlutron-extract>=0.4.0.dev0",
    # crawlutron-safe-url ships complete: regex and publicsuffixlist are hard
    # dependencies, so admission and site grouping never silently degrade.
    "crawlutron-safe-url>=0.4.0.dev0",
    "fastapi==0.165.0",
    "camoufox==0.5.9",
    "curl_cffi==0.17.0",
    "charset-normalizer==3.5.2",
    "h2==4.4.1",
    "httpx==0.28.1",
    "brotli==1.2.1",
    "lxml==6.1.3",
    "pydantic==2.14.2",
    # Local DBAPI schema migrations only; no network or telemetry behavior.
    "yoyo-migrations==9.0.0",
]

[tool.hatch.build.targets.wheel]
# Dist name (crawlutron-core) and import names (crawlutron, admission) are
# independent: importing either resolves into this one wheel.
packages = ["src/crawlutron", "src/admission"]