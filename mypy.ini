[mypy]
# Strict-ish mypy config for crawlutron. The codebase uses ``from __future__
# import annotations`` everywhere, so most annotations are evaluated lazily and
# do not require full runtime types.
#
# Wired into ``make typecheck`` by P2-A. The config predates any run of mypy and
# had to be repaired first: it carried a duplicated ``warn_unused_ignores`` and
# TOML-style ``[[tool.mypy.overrides]]`` sections, which are not valid in an
# ``.ini`` file (those are pyproject.toml syntax). The overrides are expressed
# here in the INI per-module form so they actually apply.

# Checked against 3.12 rather than the requires-python floor (>=3.11): the
# only supported/tested interpreter is 3.12 (the venv and CI both pin it), and
# the installed numpy stub -- reached transitively -- uses PEP 695 ``type``
# statements mypy cannot parse at a 3.11 target, which aborted the run before it
# reached the app tree at all.
python_version = 3.12
files = app
plugins = pydantic.mypy
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True

# Third-party libraries with no (or incomplete) type stubs. Discovered by the
# first ``make typecheck`` run (P2-A): mypy stops at an untyped import unless it
# is listed here, which prevented it from reaching the app tree at all.
# yoyo_migrations 9.0.0 is installed as the yoyo import package, but ships no
# py.typed marker or inline stubs and has no maintained stub package. Remove
# this exemption when upstream or a stub distribution provides types.
[mypy-yoyo.*]
ignore_missing_imports = True
