[mypy]
# Strict-ish mypy config for crawlutron. The codebase uses ``from __future__
# import annotations`` everywhere, so most annotations are evaluated lazily and
# do not require full runtime types.
#
# Wired into ``make typecheck`` by P2-A. The config predates any run of mypy and
# had to be repaired first: it carried a duplicated ``warn_unused_ignores`` and
# TOML-style ``[[tool.mypy.overrides]]`` sections, which are not valid in an
# ``.ini`` file (those are pyproject.toml syntax). The overrides are expressed
# here in the INI per-module form so they actually apply.

# Checked against 3.12, the requires-python floor: the
# only supported/tested interpreter is 3.12 (the venv and CI both pin it), and
# the installed numpy stub -- reached transitively -- uses PEP 695 ``type``
# statements mypy cannot parse at a 3.11 target, which aborted the run before it
# reached the crawlutron tree at all.
python_version = 3.12
files = crawlutron, tests
plugins = pydantic.mypy
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True

# Third-party libraries with no (or incomplete) type stubs. Discovered by the
# first ``make typecheck`` run (P2-A): mypy stops at an untyped import unless it
# is listed here, which prevented it from reaching the crawlutron tree at all.
# yoyo_migrations 9.0.0 is installed as the yoyo import package, but ships no
# py.typed marker or inline stubs and has no maintained stub package. Remove
# this exemption when upstream or a stub distribution provides types.
[mypy-yoyo.*]
ignore_missing_imports = True

# onnxruntime ships no py.typed marker or stubs, and doc_pool imports it only to
# call disable_telemetry_events(). Same policy as yoyo above: listed here rather
# than as an inline ``# type: ignore`` so the untyped-import exemption has one
# documented home.
[mypy-onnxruntime.*]
ignore_missing_imports = True

# The suite's process-isolation boundary. These two modules are the report that
# crosses it, and the checker had never seen either of them: `files = crawlutron` means
# no annotation in a test-harness module was ever checked, which is how four
# `Any`s stood on the only place a fetch outcome is declared and how a spawn
# target was annotated as returning a class the spawn context never produces.
# Both were invisible to a suite whose every assertion passed.
#
# `type-arg` is the rule this boundary needs rather than `disallow_any_explicit`:
# the defect is a container crossing a process boundary without saying what it
# carries, and `disallow_any_explicit` also reports `Callable[..., None]`, which
# is the exact type of a spawn target rather than an exit from the type system.
#
# The rest of the shared harness is the ratchet target, measured not guessed:
# the recursive glob reaches every private ``_*.py`` module in any ``tests/``
# subtree (the flat ``tests/_*.py`` term missed ``tests/invariants/_*.py`` and
# ``tests/api/_*.py`` entirely, #397); ``tests/invariants/test_mypy_scope.py``
# enumerates the covered set. ``mypy tests/_*.py`` reports 77 findings under this
# rule, 18 of them not explicit-`Any` (9 arg-type, 5 return-value, 2 misc, 2
# list-item). Modules join this section as they get typed.
[mypy-tests.*]
disallow_any_generics = True
