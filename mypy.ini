[mypy]
# Strict-ish mypy config for browser-crawler. The codebase uses ``from __future__
# import annotations`` everywhere, so most annotations are evaluated lazily and
# do not require full runtime types.

python_version = 3.11
files = app
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True

# Allow the existing import-not-at-top-of-file (E402) patterns that set
# environment variables before importing modules that read them at import time.
warn_unused_ignores = True

# Per-module overrides for modules that are intentionally looser-typed:
[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*"]
ignore_errors = True

# Third-party stubs we know are missing/incomplete.
[[tool.mypy.overrides]]
module = [
    "camoufox.*",
    "curl_cffi.*",
    "trafilatura.*",
    "markitdown.*",
    "pdfplumber.*",
    "playwright.*",
    "lxml.*",
]
ignore_missing_imports = True
