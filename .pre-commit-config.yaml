# Quality gates for browser-crawler.
#
# This file lives INSIDE the service on purpose: the service is destined to
# become its own repository, and its tooling should travel with it. While it is
# still a subdirectory of the dev-stack parent repo, the parent repo's
# .git/hooks/pre-commit invokes this config explicitly (`pre-commit run
# --config docker/browser-crawler/.pre-commit-config.yaml`), so nothing here
# governs the rest of dev-stack, and nothing in dev-stack governs this service.
#
# Entries resolve the service root themselves, so the same config works in both
# layouts: as `docker/browser-crawler/` inside the parent repo, and as the
# repository root once the service stands alone. `files:` matches both shapes
# for the same reason — a hook must not fire on the parent repo's other files.
#
# These gates are ergonomics, not enforcement: CI's required status check is the
# authority. Their value is that each one is whole-tree and fast, so a violation
# surfaces while the change is still in context. `language: system` means no
# hook environment is downloaded, no package index is contacted, and the
# project's own pinned tools (installed in the service venv) are what runs.
#
# ruff format is intentionally absent: the tree carries formatting debt (CI runs
# it as advisory for the same reason) and a hook that fails every commit trains
# people to bypass the gate. It belongs here once the tree is format-clean.
repos:
  - repo: local
    hooks:
      # Whole-tree style/safety lint. The ruff config in the service's
      # pyproject.toml is the single style source of truth; inline noqa is
      # banned by project rule.
      - id: ruff
        name: ruff check
        entry: >-
          bash -c 'cd "$(git rev-parse --show-toplevel)/docker/browser-crawler" 2>/dev/null
          || cd "$(git rev-parse --show-toplevel)"; exec "$@"' gate
          .venv/bin/python -m ruff check app tests scripts
        language: system
        files: ^(docker/browser-crawler/)?.*\.py$
        pass_filenames: false

      # Third type checker, scoped to the files being committed. Mypy is the
      # fail gate and Ruff owns style; this one exists because pyright finds
      # annotation lies both declared gates miss -- a `regex.Pattern` passed
      # where `re.Pattern[str]` was declared, a symbol imported from the wrong
      # module, a `urllib.error` reference that only resolved because another
      # import happened to bind the submodule. Mypy passes those because the
      # `regex` package is untyped in its config and degrades the value to Any.
      #
      # The hook runs the BUDGET TEST, not raw pyright, and that distinction is
      # the point. A raw exit code would have to be either a hard fail -- which
      # it cannot be while one proven false positive survives, since pyright
      # honours none of the three suppression forms at an annotation position --
      # or advisory, which is what "CI runs it separately" always decays into.
      # The budget assertion is the third option: any NEW annotation lie fails
      # this commit, the one known-bad finding is documented in exactly one place
      # (the test), and the test's tight-budget check fails the day the count
      # drops so the allowance cannot linger.
      #
      # Cost is ~15s (pytest startup plus 2.8s of analysis) against a 110s suite,
      # which is the right order for a gate that catches a class of defect mypy
      # structurally cannot see here.
      - id: pyright
        name: pyright budget
        entry: >-
          bash -c 'cd "$(git rev-parse --show-toplevel)/docker/browser-crawler" 2>/dev/null
          || cd "$(git rev-parse --show-toplevel)"; exec "$@"' gate
          .venv/bin/python -m pytest tests/test_pyright_budget.py -q -p no:randomly
        language: system
        files: ^(docker/browser-crawler/)?(app|tests|pyrightconfig).*
        pass_filenames: false

      # Copy/paste detection at zero tolerance, with --fail-on-empty so a future
      # path or cwd mistake cannot silently analyze nothing and pass. A clone is
      # evidence of a missing funnel, so this is a design gate, not a style one.
      #
      # Two tiers, because the two trees mean different things.
      #
      # app/ runs at the tighter 30-token bound, where duplication is a second
      # implementation of a property -- the defect class that survives review
      # (two robots caches, two public-IP verdicts). It stood at 27 pairs / 215
      # duplicated lines of 20,648, and reading them showed real missing funnels
      # rather than noise: repeated HttpFetchResult constructions, two MCP handler
      # tails, a rejection path restated across crawl_endpoint and map_endpoint,
      # two provider request builders. The HTTP subsystem split then collapsed six
      # of those pairs, taking the baseline to 16 pairs / 141 lines (0.65%) at
      # 0de8e65, and this threshold moved with it. Wave 0h then removed five more
      # pairs across the MCP refusal paths, the render admission path and the
      # migration/schema reporting, taking it to 11 pairs / 99 lines (0.46%) at
      # 19dcdc7 -- so the threshold moved again in the same commit as the work.
      # Wave 1 then split engine.py and recursive.py, and that is where this
      # ratchet nearly went the wrong way. The first strategy extraction COPIED
      # engine.py's chain and browser-result code into three new modules instead
      # of moving it, so duplication went 11 -> 22 pairs (0.46% -> 0.83%) and the
      # commit was correctly blocked. Consolidating the seams rather than
      # re-baselining took it to 10 pairs / 91 lines of 22,077 (0.41%), so the
      # threshold moved down a third time -- to 0.42, which is the tightest
      # two-decimal value that passes (0.41 fails: 91/22077 is 0.41222%).
      #
      # The threshold is a RATCHET, and it moves the moment the baseline moves --
      # not at the end of a phase. A review caught it still sitting at the old
      # 1.03 while the tree measured 0.81, which meant the gate would have
      # tolerated duplication creeping back to 215 lines before failing. That is
      # the exact failure a ratchet exists to prevent, so lowering this number is
      # part of CLOSING a de-duplication, not a separate chore to remember.
      #
      # It is 0.46, verified by RUNNING both candidates: 0.46 exits 0 and 0.45
      # exits 1. Earlier numbers here (0.9, then 1.03, then 0.66) came from
      # jscpd's ROUNDED summary line or from arithmetic on a rounded value, and
      # both mistakes had the same effect: a threshold that is not actually
      # tight, or one stricter than the thing it measures. 0.9 would have failed
      # a tree at 1.02; 0.66 was one step above the real value and a review
      # caught it by running the threshold rather than reading it.
      #
      # It stays a PERCENTAGE, and that has a known cost worth restating: the
      # denominator is the whole tree, so the number moves when good work
      # happens elsewhere. Deleting 46 lines of non-duplicated code once pushed
      # 141/21716 (0.6493%) to 141/21670 (0.6504%) and failed a gate the
      # duplication never caused. At 99 lines the window is roughly 167 lines of
      # shrinkage downward or 311 of growth upward, so re-derive this number
      # whenever the total moves materially rather than assuming it held.
      #
      # jscpd's --max-lines is NOT the integer gate it looks like: it filters out
      # clones longer than N, so a low value makes jscpd report "analyzed no
      # files" and exit 0 -- a silent pass rather than a gate. An exact integer
      # gate would read jscpd's JSON report instead, which is code in the hook
      # rather than configuration. Until that is decided, the duplicated LINE
      # count is the number to watch in review.
      #
      # The sanctioned pair is documented rather than exempt (Classification and
      # CrawlError share a prefix by design, pinned by
      # test_crawl_error_members_derive_from_classification) -- jscpd has no
      # per-clone expectation mechanism, so such pairs live in the baseline
      # instead of an ignore list that could swallow a future offender.
      #
      # tests/ keeps the 50-token bound at zero tolerance. At 30 it reports 157
      # pairs, and reading them shows per-test setup that legitimately looks
      # alike (same endpoint, different URL and assertion), not missing funnels;
      # abstracting those would hide what each test proves. The test-side
      # funnels that were real were larger, and were found at 50.
      - id: jscpd-app
        name: jscpd app/ (ratchet, 30 tokens)
        entry: >-
          bash -c 'cd "$(git rev-parse --show-toplevel)/docker/browser-crawler" 2>/dev/null
          || cd "$(git rev-parse --show-toplevel)"; exec "$@"' gate
          jscpd -f python --min-lines 5 --min-tokens 30 --threshold 0.42 --fail-on-empty app
        language: system
        files: ^(docker/browser-crawler/)?app/.*\.py$
        pass_filenames: false

      - id: jscpd-tests
        name: jscpd tests/ (zero tolerance, 50 tokens)
        entry: >-
          bash -c 'cd "$(git rev-parse --show-toplevel)/docker/browser-crawler" 2>/dev/null
          || cd "$(git rev-parse --show-toplevel)"; exec "$@"' gate
          jscpd -f python --threshold 0 --fail-on-empty tests
        language: system
        files: ^(docker/browser-crawler/)?tests/.*\.py$
        pass_filenames: false

      # Type gate: catches the stringly-typed-identity class statically, and is
      # the same command CI runs. On pre-push because it is slower than the two
      # above and a type error is worth catching slightly later than lint.
      - id: mypy
        name: mypy
        entry: >-
          bash -c 'cd "$(git rev-parse --show-toplevel)/docker/browser-crawler" 2>/dev/null
          || cd "$(git rev-parse --show-toplevel)"; exec "$@"' gate
          .venv/bin/python -m mypy app
        language: system
        files: ^(docker/browser-crawler/)?.*\.py$
        pass_filenames: false
        stages: [pre-push]

      # The project-specific safety predicates (chokepoint detectors). They are
      # the real architecture gate and the only exit path for those rules, so
      # they run on pre-push rather than living only in CI.
      - id: safety-invariants
        name: chokepoint safety invariants
        entry: >-
          bash -c 'cd "$(git rev-parse --show-toplevel)/docker/browser-crawler" 2>/dev/null
          || cd "$(git rev-parse --show-toplevel)"; exec "$@"' gate
          .venv/bin/python -m pytest -q -p no:randomly
          tests/test_safety_invariants.py tests/test_env_regression.py
          tests/test_store_pragma_chokepoint.py tests/membership_gate.py
        language: system
        files: ^(docker/browser-crawler/)?.*\.py$
        pass_filenames: false
        stages: [pre-push]
