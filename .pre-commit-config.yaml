# Quality gates for browser-crawler.
#
# This file lives INSIDE the service on purpose: the service is destined to
# become its own repository, and its tooling should travel with it. While it is
# still a subdirectory of the dev-stack parent repo, the parent repo's
# .git/hooks/pre-commit invokes this config explicitly (`pre-commit run
# --config docker/browser-crawler/.pre-commit-config.yaml`), so nothing here
# governs the rest of dev-stack, and nothing in dev-stack governs this service.
#
# Entries resolve the service root themselves, so the same config works in both
# layouts: as `docker/browser-crawler/` inside the parent repo, and as the
# repository root once the service stands alone. `files:` matches both shapes
# for the same reason — a hook must not fire on the parent repo's other files.
#
# `files:` is a TRIGGER, not a list of inputs. All five hooks are whole-tree
# with `pass_filenames: false`, so the trigger decides "should this scan run"
# not "which files this hook reads." A per-file guess drifts: the old pattern
# listed .py and the gate configs but not `.gitignore`, so the commit that
# edited `.gitignore` ran zero hooks (commit 6373dce). This trigger matches any
# file that belongs to this service in either layout — nested under the parent
# repo as `docker/browser-crawler/*`, or at the repository root once extracted —
# and excludes the parent repo's OTHER docker services (e.g. `docker/llm/`).
#
# All five hooks share one YAML anchor (`*service_trigger`) so the trigger
# cannot drift across copies: changing one automatically changes all.
#
# All five hooks also share ONE entry preamble, and it is a committed helper
# rather than a YAML anchor. An anchor can only supply a whole scalar, and each
# hook has to extend the preamble with its own command, so an anchored prefix is
# not expressible in YAML; a file is. `scripts/gate` owns the two things the
# preamble decided: which root is the service (nested under dev-stack as
# `docker/browser-crawler/`, or the repository root after the extraction is a
# file copy) and which interpreter runs the gate (the service's own pinned
# `.venv`, never whatever `python3` happens to be on the machine). The entry
# keeps only the part that cannot move: a file that lives at two different
# relative paths in the two layouts cannot be named by one relative path from
# the repository root, which is where pre-commit runs every hook. That behaviour
# is asserted by EXECUTION -- the contract builds a synthetic repository in each
# layout and runs the real entry string in it -- not by matching the config text.
#
# The five entries are still five copies of that one-line lookup, because YAML
# cannot interpolate, so nothing in the file stops them from drifting apart. The
# contract closes that gap instead: every entry must be byte-identical up to its
# command, and `scripts/gate` is an enforcement input, so a commit that edits
# the helper runs the gates.
#
# These gates are ergonomics, not enforcement: CI's required status check is the
# authority. Their value is that each one is whole-tree and fast, so a violation
# surfaces while the change is still in context. `language: system` means no
# hook environment is downloaded, no package index is contacted, and the
# project's own pinned tools (installed in the service venv) are what runs.
#
# ruff format is intentionally absent: the tree carries formatting debt (CI runs
# it as advisory for the same reason) and a hook that fails every commit trains
# people to bypass the gate. It belongs here once the tree is format-clean.
repos:
  - repo: local
    hooks:
      # Whole-tree style/safety lint. The ruff config in the service's
      # pyproject.toml is the single style source of truth; inline noqa is
      # banned by project rule.
      - id: ruff
        name: ruff check
        entry: >-
          bash -c 'for d in "$(git rev-parse --show-toplevel)/docker/browser-crawler" "$(git rev-parse --show-toplevel)"; do [ -x "$d/scripts/gate" ] && exec bash "$d/scripts/gate" "$@"; done; echo "scripts/gate not found in either layout" >&2; exit 1' gate
          .venv/bin/python -m ruff check app tests scripts
        language: system
        files: &service_trigger ^(docker/browser-crawler/|(?!docker/))
        pass_filenames: false
        stages: [pre-commit]

      # Third type checker, scoped to the files being committed. Mypy is the
      # fail gate and Ruff owns style; this one exists because pyright finds
      # annotation lies both declared gates miss -- a `regex.Pattern` passed
      # where `re.Pattern[str]` was declared, a symbol imported from the wrong
      # module, a `urllib.error` reference that only resolved because another
      # import happened to bind the submodule. Mypy passes those because the
      # `regex` package is untyped in its config and degrades the value to Any.
      #
      # The hook runs the BUDGET TEST, not raw pyright, and that distinction is
      # the point. A raw exit code would have to be either a hard fail -- which
      # it cannot be while one proven false positive survives, since pyright
      # honours none of the three suppression forms at an annotation position --
      # or advisory, which is what "CI runs it separately" always decays into.
      # The budget assertion is the third option: any NEW annotation lie fails
      # this commit, the one known-bad finding is documented in exactly one place
      # (the test), and the test's tight-budget check fails the day the count
      # drops so the allowance cannot linger.
      #
      # Cost is ~15s (pytest startup plus 2.8s of analysis) against a 110s suite,
      # which is the right order for a gate that catches a class of defect mypy
      # structurally cannot see here.
      - id: pyright
        name: pyright budget
        entry: >-
          bash -c 'for d in "$(git rev-parse --show-toplevel)/docker/browser-crawler" "$(git rev-parse --show-toplevel)"; do [ -x "$d/scripts/gate" ] && exec bash "$d/scripts/gate" "$@"; done; echo "scripts/gate not found in either layout" >&2; exit 1' gate
          .venv/bin/python -m pytest tests/test_pyright_budget.py -q -p no:randomly
        language: system
        files: *service_trigger
        pass_filenames: false
        stages: [pre-commit]

      # Copy/paste detection is a design gate, scored per tree. The checked-in
      # wrapper reads jscpd JSON, requires a non-empty scan of every root, and
      # compares every pair with the named expectations file; the command-line
      # thresholds below are the only threshold source.
      #
      # One floor for every root, because one flat floor cannot serve both
      # trees: at 8 lines / 40 tokens this whole service reported exactly one
      # pair and both sides of it were in `app/`, so production duplication was
      # invisible behind a number picked for test scaffolding. A per-root split
      # is the other answer and is not taken either, because a single number that
      # every root is held to is the one that cannot be quietly relaxed for the
      # tree it is inconvenient in.
      #
      # The floor is 4 lines / 25 tokens, which is where the last two pairs live.
      # Both are DECLARED in jscpd-expectations.json rather than hidden above the
      # floor, because they are not drift at all: each is two spellings that a
      # machine-checked guard exists to compare, so the tree holds the copy on
      # purpose and the guard is what makes the copy safe. The baseline pins each
      # fragment by content hash and names the guard, so editing either side turns
      # the entry into an unsanctioned clone and sends the change back through
      # review instead of leaving a stale approval behind. Holding the floor above
      # them instead would have bought a tidy list at the cost of never seeing a
      # 25-38 token clone anywhere, which is the band most real duplication in
      # this tree actually measured at.
      # Each root is still scanned by its own jscpd invocation, because jscpd's
      # reported names are relative to the scan root. Zero tolerance; the number
      # ratchets down, not up.
      - id: jscpd
        name: jscpd per tree (4 lines / 25 tokens, zero tolerance)
        entry: >-
          bash -c 'for d in "$(git rev-parse --show-toplevel)/docker/browser-crawler" "$(git rev-parse --show-toplevel)"; do [ -x "$d/scripts/gate" ] && exec bash "$d/scripts/gate" "$@"; done; echo "scripts/gate not found in either layout" >&2; exit 1' gate
          .venv/bin/python tests/_jscpd_gate.py all --fail-on-empty
          --min-lines 4
          --min-tokens 25
          --threshold 0
        language: system
        files: *service_trigger
        pass_filenames: false
        stages: [pre-commit]

      # Type gate: catches the stringly-typed-identity class statically, and is
      # the same command CI runs.
      - id: mypy
        name: mypy
        entry: >-
          bash -c 'for d in "$(git rev-parse --show-toplevel)/docker/browser-crawler" "$(git rev-parse --show-toplevel)"; do [ -x "$d/scripts/gate" ] && exec bash "$d/scripts/gate" "$@"; done; echo "scripts/gate not found in either layout" >&2; exit 1' gate
          .venv/bin/python -m mypy app
        language: system
        files: *service_trigger
        pass_filenames: false
        stages: [pre-commit]

      # The project-specific safety predicates (chokepoint detectors). They are
      # the real architecture gate and the only exit path for those rules.
      - id: safety-invariants
        name: chokepoint safety invariants
        entry: >-
          bash -c 'for d in "$(git rev-parse --show-toplevel)/docker/browser-crawler" "$(git rev-parse --show-toplevel)"; do [ -x "$d/scripts/gate" ] && exec bash "$d/scripts/gate" "$@"; done; echo "scripts/gate not found in either layout" >&2; exit 1' gate
          .venv/bin/python -m pytest -q -p no:randomly
          tests/test_safety_invariants.py tests/test_env_regression.py
          tests/test_store_pragma_chokepoint.py tests/membership_gate.py
        language: system
        files: *service_trigger
        pass_filenames: false
        stages: [pre-commit]
