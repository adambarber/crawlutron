# Quality gates for crawlutron. The seven pre-commit-stage hooks run THROUGH
# scripts/gate_fanout, which starts every gate child at once on the first hook
# of a run and lets each hook wait only on its own child; the commands after
# each entry's `--` remain the single declaration of what that gate runs.
#
# This file lives INSIDE the service and IS the repository's own
# `.pre-commit-config.yaml`: the service is now its own repository, so pre-commit
# discovers it natively at this root and `pre-commit run --all-files` needs no
# `--config` flag.
#
# Entries still resolve the service root themselves and still name TWO candidate
# paths, so this tree also works when it is vendored into a monorepo under
# `docker/browser-crawler/`. That dual-layout support is kept deliberately rather
# than deleted after the extraction: it costs one `for` loop over two candidate
# directories, it is asserted by execution in both layouts, and it is what lets
# the tree be vendored back without a second edit. In a repository that is only
# ever one layout it would be dead weight, which is why this paragraph is here.
# `files:` matches both shapes for the same reason — a hook must not fire on a
# parent repo's OTHER docker services (e.g. `docker/llm/`).
#
# `files:` is a TRIGGER, not a list of inputs. Every hook is whole-tree
# with `pass_filenames: false`, so the trigger decides "should this scan run"
# not "which files this hook reads." A per-file guess drifts: the old pattern
# listed .py and the gate configs but not `.gitignore`, so the commit that
# edited `.gitignore` ran zero hooks (commit 6373dce). This trigger matches any
# file that belongs to this service in either layout — at the repository root,
# or nested under a parent repo as `docker/browser-crawler/*` — and excludes a
# parent repo's OTHER docker services.
#
# All hook entries share one YAML anchor (`*service_trigger`) so the trigger
# cannot drift across copies: changing one automatically changes all.
#
# All hook entries also share ONE entry preamble, and it is a committed helper
# rather than a YAML anchor. An anchor can only supply a whole scalar, and each
# hook has to extend the preamble with its own command, so an anchored prefix is
# not expressible in YAML; a file is. `scripts/gate` owns the two things the
# preamble decided: which root is the service (nested under dev-stack as
# `docker/browser-crawler/`, or the repository root after the extraction is a
# file copy) and which interpreter runs the gate (the service's own pinned
# `.venv`, never whatever `python3` happens to be on the machine). The entry
# keeps only the part that cannot move: a file that lives at two different
# relative paths in the two layouts cannot be named by one relative path from
# the repository root, which is where pre-commit runs every hook. That behaviour
# is asserted by EXECUTION -- the contract builds a synthetic repository in each
# layout and runs the real entry string in it -- not by matching the config text.
#
# The entries are still copies of that one-line lookup, because YAML
# cannot interpolate, so nothing in the file stops them from drifting apart. The
# contract closes that gap instead: every entry must be byte-identical up to its
# command, and `scripts/gate` is an enforcement input, so a commit that edits
# the helper runs the gates.
#
# This file is the only place a gate command is written. CI runs
# `pre-commit run --all-files` rather than restating ruff, mypy, basedpyright and
# jscpd, and `make lint` / `make typecheck` invoke hooks by id from here instead
# of spelling out their own copies. The Makefile did not always: it carried a
# second `ruff check crawlutron tests scripts` and a bare `mypy` that had already
# drifted from these in both scope and interpreter, and nothing compared them,
# because the contract tests covered CI and this file and the Makefile was not
# one of the things under contract. It is now -- tests/
# test_makefile_contract.py fails if a recipe runs a gate tool directly, or
# names a hook id this file does not declare, and the Makefile is in
# ENFORCEMENT_INPUTS so editing it re-runs every gate below.
#
# These gates are ergonomics, not enforcement: CI's required status check is the
# authority. Their value is that each one is whole-tree and fast, so a violation
# surfaces while the change is still in context. `language: system` means no
# hook environment is downloaded, no package index is contacted, and the
# project's own pinned tools (installed in the service venv) are what runs.
#
# ruff format joined the gates once the tree was actually format-clean, which
# is the condition this comment used to name as a precondition. It was absent
# because the tree carried formatting debt and a hook that fails every commit
# trains people to bypass the gate -- both true, and both reasons to clear the
# debt rather than to keep declining the check. The debt was then cleared in
# full, so the check could be added without failing anyone.
#
# The point is that formatting stopped being a convention. With no hook, it was
# maintained by whoever happened to run `ruff format` and nobody noticed when
# they did not: twenty-one files had drifted, and the fix was a hand sweep
# rather than anything that stopped the next one. A gate that only exists once
# the debt is paid is worth having precisely because the debt was paid.
repos:
  - repo: local
    hooks:
      # Whole-tree style/safety lint. The ruff config in the service's
      # pyproject.toml is the single style source of truth; inline noqa is
      # banned by project rule.
      - id: ruff
        name: ruff check
        entry: >-
          bash -c 'for d in "$(git rev-parse --show-toplevel)/docker/browser-crawler" "$(git rev-parse --show-toplevel)"; do [ -x "$d/scripts/gate" ] && exec bash "$d/scripts/gate" "$@"; done; echo "scripts/gate not found in either layout" >&2; exit 1' gate
          .venv/bin/python -m scripts.gate_fanout ruff -- .venv/bin/python -m ruff check crawlutron tests scripts
        language: system
        files: &service_trigger ^(docker/browser-crawler/|(?!docker/))
        pass_filenames: false
        stages: [pre-commit]

      # Formatter as a gate, not as advice. `check` rather than a bare
      # invocation so the hook reports drift instead of silently rewriting the
      # tree on the way past: an auto-fixing hook would commit other people's
      # changes to their files, and this one is scoped whole-tree so a violation
      # is visible while the change that caused it is still in context.
      - id: ruff-format
        name: ruff format
        entry: >-
          bash -c 'for d in "$(git rev-parse --show-toplevel)/docker/browser-crawler" "$(git rev-parse --show-toplevel)"; do [ -x "$d/scripts/gate" ] && exec bash "$d/scripts/gate" "$@"; done; echo "scripts/gate not found in either layout" >&2; exit 1' gate
          .venv/bin/python -m scripts.gate_fanout ruff-format -- .venv/bin/python -m ruff format --check crawlutron tests scripts
        language: system
        files: *service_trigger
        pass_filenames: false
        stages: [pre-commit]

      # Third type checker, scoped to the files being committed. Mypy is the
      # fail gate and Ruff owns style; this one exists because basedpyright
      # finds annotation lies both declared gates miss -- a `regex.Pattern`
      # passed where `re.Pattern[str]` was declared, a symbol imported from the
      # wrong module, a `urllib.error` reference that only resolved because
      # another import happened to bind the submodule. Mypy passes those because
      # the `regex` package is untyped in its config and degrades the value to
      # Any.
      #
      # The hook runs basedpyright directly -- no wrapper. A raw exit code IS
      # the gate: any finding fails the commit, and basedpyright fails close
      # where pyright passed empty (a config whose include matches nothing
      # reports "does not exist" and exits 3 instead of "0 errors"), so the
      # whole-tree analysis cannot silently analyze nothing. `--pythonpath` pins
      # the interpreter to the service venv, the one the gates actually run.
      #
      # Cost is ~2.8s of analysis with none of the pytest startup the old
      # budget-test wrapper paid.
      - id: basedpyright
        name: basedpyright whole tree (zero annotation lies)
        entry: >-
          bash -c 'for d in "$(git rev-parse --show-toplevel)/docker/browser-crawler" "$(git rev-parse --show-toplevel)"; do [ -x "$d/scripts/gate" ] && exec bash "$d/scripts/gate" "$@"; done; echo "scripts/gate not found in either layout" >&2; exit 1' gate
          .venv/bin/python -m scripts.gate_fanout basedpyright -- .venv/bin/basedpyright --pythonpath .venv/bin/python
        language: system
        files: *service_trigger
        pass_filenames: false
        stages: [pre-commit]

      # Copy/paste detection is a design gate. The wrapper reads jscpd JSON and
      # requires a non-empty scan of every root; the command-line thresholds
      # below are the only threshold source, and a duplicate at that floor is a
      # finding with no exemption path.
      #
      # Floor tightened 3/30 -> 2/30 (2026-10-27): the whole repo measures ZERO
      # pairs at 2/30 over 687 sources; the single root-level invocation covers
      # production, test, and cross trees, so no clone spans a boundary unseen.
      # The floor ratchets down, not up.
      - id: jscpd
        name: jscpd per tree (2 lines / 30 tokens, zero tolerance)
        entry: >-
          bash -c 'for d in "$(git rev-parse --show-toplevel)/docker/browser-crawler" "$(git rev-parse --show-toplevel)"; do [ -x "$d/scripts/gate" ] && exec bash "$d/scripts/gate" "$@"; done; echo "scripts/gate not found in either layout" >&2; exit 1' gate
          .venv/bin/python -m scripts.gate_fanout jscpd -- .venv/bin/python -m scripts.jscpd_gate all
          --min-lines 2
          --min-tokens 30
          --threshold 0
        language: system
        files: *service_trigger
        pass_filenames: false
        stages: [pre-commit]

      # Type gate: catches the stringly-typed-identity class statically, and is
      # the same command CI runs. No path argument: `mypy.ini`'s `files` is the
      # scope, and this hook restating it as `mypy crawlutron` is how a second checker
      # scope silently grew without the hook's gate covering it.
      - id: mypy
        name: mypy
        entry: >-
          bash -c 'for d in "$(git rev-parse --show-toplevel)/docker/browser-crawler" "$(git rev-parse --show-toplevel)"; do [ -x "$d/scripts/gate" ] && exec bash "$d/scripts/gate" "$@"; done; echo "scripts/gate not found in either layout" >&2; exit 1' gate
          .venv/bin/python -m scripts.gate_fanout mypy -- .venv/bin/python -m mypy
        language: system
        files: *service_trigger
        pass_filenames: false
        stages: [pre-commit]

      # Dead-code gate: vulture, an existing library rather than a hand-rolled
      # detector. Bare by rule -- no ignore-names, no excludes, no whitelist
      # file, no ignore-decorators: a finding is fixed in the code or it is not
      # fixed. The floor is 90, the strictest band this tree holds green without
      # suppression, because the 60 band reports only names consumed by
      # dispatch no usage analysis can see -- pydantic wire fields and
      # validators, pytest fixtures and collected test names, http.server
      # handler methods, FastAPI route registration. Every real finding the
      # 60-band triage surfaced was cleaned instead: dead helpers deleted, the
      # never-recorded pause metric removed end to end, MAX_RATE_LIMIT_RPS
      # wired as the model's le= source of truth, and one silently-skipped
      # test (a near-miss name pytest never collected) renamed and restored.
      - id: vulture
        name: vulture dead code (min-confidence 90, zero tolerance)
        entry: >-
          bash -c 'for d in "$(git rev-parse --show-toplevel)/docker/browser-crawler" "$(git rev-parse --show-toplevel)"; do [ -x "$d/scripts/gate" ] && exec bash "$d/scripts/gate" "$@"; done; echo "scripts/gate not found in either layout" >&2; exit 1' gate
          .venv/bin/python -m scripts.gate_fanout vulture -- .venv/bin/python -m vulture crawlutron tests scripts --min-confidence 90
        language: system
        files: *service_trigger
        pass_filenames: false
        stages: [pre-commit]

      # The repo rule "every commit cites an issue" was convention-only (#492): none of
      # the pre-commit-stage hooks reads the message. This one does, at commit-msg stage.
      - id: commit-citation
        name: commit message cites an issue
        entry: >-
          bash -c 'for d in "$(git rev-parse --show-toplevel)/docker/browser-crawler" "$(git rev-parse --show-toplevel)"; do [ -x "$d/scripts/gate" ] && exec bash "$d/scripts/gate" "$@"; done; echo "scripts/gate not found in either layout" >&2; exit 1' gate
          .venv/bin/python -m scripts.commit_citation_gate
        language: system
        # No `files:` trigger: a commit-msg hook receives the MESSAGE FILE, not
        # changed filenames, so the service trigger only ever SUPPRESSED this
        # hook for non-service commits (#588) -- a bad message passed unseen.
        pass_filenames: true
        stages: [commit-msg]

      # Coverage as a measured-descriptive surface, not a gate: no threshold,
      # no fail-under, no ratchet until the owner rules one. It runs at the
      # pre-push stage -- a measurement pass on every commit would train
      # --no-verify -- and `files:` scopes it to crawlutron/tests so docs-only
      # commits skip it entirely. The engine config lives once in
      # pyproject.toml ([tool.coverage.run], core = "sysmon" via PEP 669 on
      # Python 3.12, the lever that holds tracer overhead to a measured
      # median-of-3 figure recorded in the coverage hook's ticket evidence).
      # The report is a separate untimed step (`python -m coverage report
      # --skip-covered`) so the timed pass measures tracing only.
      #
      # Depth is NOT configured here: the deeper surface (branch +
      # dynamic_context="test_function", weekly / pre-release) pairs with the
      # mutation-proof evidence story and is documented in pyproject's
      # [tool.coverage] comment block instead of being a second wired command.
      - id: coverage
        name: coverage (measured-descriptive, pre-push)
        entry: >-
          bash -c 'for d in "$(git rev-parse --show-toplevel)/docker/browser-crawler" "$(git rev-parse --show-toplevel)"; do [ -x "$d/scripts/gate" ] && exec bash "$d/scripts/gate" "$@"; done; echo "scripts/gate not found in either layout" >&2; exit 1' gate
          .venv/bin/python -m pytest -q -o addopts="" -n 4 --dist worksteal --cov=crawlutron --cov-report=
        language: system
        files: ^(crawlutron|tests)/
        pass_filenames: false
        stages: [pre-push]

      # The full randomized battery: commit admission includes BEHAVIOR, not
      # only tree shape. One pytest invocation runs at pre-commit — this child
      # IS the whole suite, subsuming the retired invariants-subset child.
      - id: battery
        name: full randomized battery (commit admission control)
        entry: >-
          bash -c 'for d in "$(git rev-parse --show-toplevel)/docker/browser-crawler" "$(git rev-parse --show-toplevel)"; do [ -x "$d/scripts/gate" ] && exec bash "$d/scripts/gate" "$@"; done; echo "scripts/gate not found in either layout" >&2; exit 1' gate
          .venv/bin/python -m scripts.gate_fanout battery -- .venv/bin/python -m pytest -q
        language: system
        files: *service_trigger
        pass_filenames: false
        stages: [pre-commit]
