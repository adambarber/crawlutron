name: Prepare a gate environment
description: >
  Everything a gate needs after the checkout: the 3.14 interpreter and the frozen
  install. One definition, so a new gate job cannot drift from the environment
  the others use. The checkout itself stays in the job: GitHub resolves a local
  action before any step runs, so an action that checked out would run before
  the repository existed on disk.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.14"
    # The venv is the service's own: the hook entries resolve `.venv/bin/...`
    # relative to the service root, and every hook is `language: system`, so this
    # is the only place the tools come from. Installed from the frozen lock
    # (#622) -- an unpinned install would re-resolve the transitive graph.
    - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install the frozen environment
      run: uv sync --frozen --extra dev
      shell: bash
    # The version artifact is gitignored, so a fresh checkout has none until
    # the editable install writes it during `uv sync`. Gate state the hooks
    # persist across runs (mypy's incremental cache, ruff's cache), keyed on
    # the lock + pyproject so a dependency or config bump invalidates it.
    # Per-job keys: with one shared key the first gate job to finish reserves
    # it and every other job's save is silently dropped, so only one tool's
    # cache ever persisted. `.gate_fanout` is NOT cached: it holds per-run
    # pidfiles, and a pid from another runner would be read as "a hung child
    # from an earlier run" and killed -- or raise, which is what redded every
    # gate when CI split into one job per gate.
    - name: Cache gate state
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          .mypy_cache
          .ruff_cache
        key: gate-state-${{ runner.os }}-${{ github.job }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
        restore-keys: |
          gate-state-${{ runner.os }}-${{ github.job }}-
