version: 2
updates:
  # Dependency updates for the crawlutron service itself (not vendored layouts).
  # crawlutron is its own repository; this file lives at the service root.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    # Native uv support updates pyproject.toml and uv.lock in the same PR.
    groups:
      crawlutron-deps:
        patterns: ["*"]

  # Dependabot understands SHA-pinned actions: it bumps the SHA and its version
  # comment together, so the manual-pin policy stays current with less toil.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
