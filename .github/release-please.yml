# Triggered by the google-github-actions/release-please-action on main (#561).
# CI configs stay non-invasive per the #489 ruling: this file is inert until the
# repo goes public and Actions are restored -- it must not run against anything.
on:
  push:
    branches: [main]
name: release-please
# Least privilege: release-please opens a Release PR and creates releases, and
# the SBOM step (#699) uploads an asset to the release it creates. No other
# scope; the default write-all token must not leak into any step here.
permissions:
  contents: write
  pull-requests: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: google-github-actions/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # #699: ship a machine-readable SBOM with every release. Runs only when a
      # release was actually created, from the frozen lock (the same export CI's
      # audit job uses), with a pinned tool version, uploaded next to the release.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        if: ${{ steps.release.outputs.release_created == 'true' }}
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Generate SBOM from the frozen lock
        if: ${{ steps.release.outputs.release_created == 'true' }}
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/crawlutron-lock.txt
          uv tool run --from cyclonedx-bom==8.0.1 cyclonedx-py requirements /tmp/crawlutron-lock.txt -o sbom.cdx.json --of json
      - name: Upload SBOM to the release
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ steps.release.outputs.tag_name }}" sbom.cdx.json --clobber
