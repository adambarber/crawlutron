# zizmor policy for this repository's workflows. Each accepted class is a
# deliberate design decision, written down here so the audit is honest rather
# than silencing whatever it finds; anything not listed must be fixed.
#
# agent-review.yml uses workflow_run deliberately with a two-plane trust split:
# - Plane A (probes): no secrets, runs only pinned base-tree scripts
# - Plane B (review): consumes probe artifacts as data only, never executes PR code
rules:
  cache-poisoning:
    ignore:
      # ci.yml's caches (gate state, Camoufox, uv) feed read-only gate jobs.
      # The publish job in release.yml builds fresh with enable-cache: false
      # and restores nothing, so a poisoned entry has no path to a published
      # artifact. packaging.yml builds and checks but never uploads; the
      # release rebuilds without its caches for the same reason.
      - ci.yml
      - packaging.yml
  dangerous-triggers:
    ignore:
      # agent-review.yml uses workflow_run with a two-plane trust split.
      # Plane A (probes) has no secrets and runs only pinned base-tree scripts.
      # Plane B (review) consumes probe artifacts as data only, never executes PR code.
      - agent-review.yml
# Read-only posture is enforced by the default excessive-permissions audit
# and tests/test_release_contract.py; no posture override exists in zizmor.