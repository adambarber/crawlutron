name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"  # Daily at 3am UTC
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite (nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Prepare gate environment
        uses: $/.github/actions/prepare

      - name: Install pinned fpgen fingerprint model
        run: .venv/bin/python -c "from camoufox.fpgen_model import ensure_fpgen_model; ensure_fpgen_model()"

      - name: Cache Camoufox browser binary
        id: camoufox
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Camoufox browser binary
        if: ${{ steps.camoufox.outputs.cache-hit != 'true' }}
        run: .venv/bin/python -m camoufox fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare browser runtime
        uses: $/.github/actions/prepare-browser

      - name: Pre-warm bytecode for the nightly run
        run: .venv/bin/python -m compileall -q packages/*/src tests scripts

      - name: Run full test suite (no -m filter) with coverage
        env:
          NO_PROXY: 127.0.0.1,localhost
          CRAWLUTRON_HEADLESS: "false"
          GATE_FANOUT_WALL_SECONDS: "300"
          PYTEST_ADDOPTS: "--cov=crawlutron --cov-branch --cov-report= --cov-append -p pytest_cov --junitxml=junit-nightly.xml"
        run: xvfb-run -a .venv/bin/python -m pytest

      - name: Generate coverage reports
        run: .venv/bin/python scripts/coverage_reports.py

      - name: Upload coverage data artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-data-nightly
          path: .coverage*
          if-no-files-found: warn

      - name: Upload junit artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: junit-nightly
          path: junit-nightly.xml
          if-no-files-found: warn

      - name: Upload coverage reports artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-reports-nightly
          path: coverage_reports/
          if-no-files-found: warn

  coverage:
    name: Coverage (nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ always() }}
    needs: [test]
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Prepare gate environment
        uses: $/.github/actions/prepare

      - name: Download coverage data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: ${{ always() }}
        with:
          name: coverage-data-nightly
          path: .

      - name: Download junit results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        if: ${{ always() }}
        with:
          name: junit-nightly
          path: junit/nightly

      - name: Combine coverage data
        run: .venv/bin/python -m coverage combine

      - name: Generate coverage reports
        run: .venv/bin/python scripts/coverage_reports.py

      - name: Upload coverage XML to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: coverage_reports/coverage.xml
          flags: nightly
          use_oidc: true
          fail_ci_if_error: false

      - name: Upload coverage reports artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-report-nightly
          path: coverage_reports/
          if-no-files-found: error

      - name: Upload nightly junit to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: junit/nightly/junit-nightly.xml
          flags: nightly
          report-type: test_results
          use_oidc: true
          fail_ci_if_error: false