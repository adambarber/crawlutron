name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"  # Daily at 3am UTC
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test suite (nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Prepare gate environment
        uses: $/.github/actions/prepare

      - name: Prepare browser runtime
        uses: $/.github/actions/prepare-browser

      - name: Pre-warm bytecode for the nightly run
        run: .venv/bin/python -m compileall -q packages/*/src tests scripts

      - name: Run full test suite (no -m filter) with coverage
        uses: $/.github/actions/run-tests
        with:
          browser: true

      - name: Generate coverage reports
        run: .venv/bin/python -m scripts.coverage_reports

      - name: Upload coverage data artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-data-nightly
          path: .coverage*
          if-no-files-found: error

      - name: Upload junit artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: junit-nightly
          path: junit-test-*.xml
          if-no-files-found: error

      - name: Upload coverage reports artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-reports-nightly
          path: coverage_reports/
          if-no-files-found: error

  coverage:
    name: Coverage (nightly)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ always() }}
    needs: [test]
    permissions:
      contents: read
      pull-requests: read
      # Codecov tokenless upload; no other nightly job needs this grant.
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Prepare gate environment
        uses: $/.github/actions/prepare

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: ${{ always() }}
        with:
          name: coverage-data-nightly
          path: .

      - name: Download junit results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        if: ${{ always() }}
        with:
          name: junit-nightly
          path: junit/nightly

      - name: Combine coverage data
        run: .venv/bin/python -m coverage combine

      - name: Generate coverage reports
        run: .venv/bin/python -m scripts.coverage_reports

      - name: Upload coverage XML to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: coverage_reports/coverage.xml
          flags: nightly
          use_oidc: true
          fail_ci_if_error: true

      - name: Upload coverage reports artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-report-nightly
          path: coverage_reports/
          if-no-files-found: error

      - name: Upload nightly junit to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: junit/nightly/junit-test-*.xml
          flags: nightly
          report_type: test_results
          use_oidc: true
          fail_ci_if_error: true