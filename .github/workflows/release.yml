name: Release

# The tag is the release act. hatch-vcs derives the version from the newest git
# tag, so cutting a release is `git tag vX.Y.Z && git push --tags`; this workflow
# turns that tag into artifacts and publishes nothing else, ever.
#
# Publishing to PyPI uses trusted publishing (OIDC): there is no stored token to
# leak, and the workflow identity is the credential. Each project needs one
# trusted publisher configured on pypi.org (see docs/RELEASE.md); a name that is
# not yet claimed needs a pending publisher.
#
# ci.yml stays `permissions: read-all` and cannot publish (#624). Only this
# tag-triggered workflow carries write scope, and each job carries the narrowest
# set it needs.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  distributions:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      # Trusted publishing exchanges this OIDC token for a short-lived upload
      # token; it is never a long-lived credential.
      id-token: write
    env:
      # Bootstrap escape hatch. PyPI dedupes *pending* publishers on the workflow
      # identity, so a name that does not exist yet cannot be pre-registered while
      # another is pending. With this secret set the publish uses a scoped API
      # token instead; unset, it uses trusted publishing. Delete the secret once
      # every name is registered.
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Assert the tag carries the version the build will derive
        # A mis-tagged release must fail before anything is published: a tag that
        # does not match the tree would ship `0.0.0.dev0` under a semver name.
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          uv build --all-packages --out-dir dist >/dev/null
          uv run --no-project --python 3.14 python - "$TAG" <<'PY'
          import pathlib
          import sys
          import tarfile

          tag = sys.argv[1]
          sdists = sorted(pathlib.Path("dist").glob("*.tar.gz"))
          if not sdists:
              sys.exit("no sdist built")
          bad = []
          for sdist in sdists:
              with tarfile.open(sdist) as tf:
                  name = tf.getnames()[0].split("/")[0]
              # An sdist directory is `{name}-{version}`; a dev suffix means the
              # tag did not reach the tree this built from.
              version = name.split("-", 1)[1]
              print(f"{sdist.name}: {version}")
              if version != tag:
                  bad.append(f"{sdist.name} carries {version}, tag is {tag}")
          for line in bad:
              print(f"::error::{line}")
          sys.exit(1 if bad else 0)
          PY

      - name: Inspect every artifact
        run: uvx twine check --strict dist/*

      - name: Publish to PyPI (trusted publishing)
        if: ${{ env.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/

      - name: Publish to PyPI (bootstrap token)
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}

  image:
    name: Publish the container image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install the frozen environment
        run: uv sync --frozen --extra dev

      - name: Resolve the release version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(.venv/bin/python scripts/regen_version.py --print)"
          echo "native=${VERSION}"
          # GHCR names are lowercase and docker refs reject '+'.
          TAG="$(printf %s "$VERSION" | tr '[:upper:]' '[:lower:]' | tr '+' '-')"
          echo "tag=${TAG}"
          echo "native=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the runtime image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73c547607 # v6
        with:
          context: .
          target: runtime
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/crawlutron:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/crawlutron:latest

      - name: Smoke the pushed image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/crawlutron"
          TAG="${{ steps.version.outputs.tag }}"
          NAME="crawlutron-smoke"
          docker rm -f "$NAME" >/dev/null 2>&1 || true
          # The CMD binds loopback by default; Docker -p cannot reach a loopback-
          # bound process, so bind 0.0.0.0 exactly as docker-compose.yml does.
          docker run -d --name "$NAME" -e CRAWLUTRON_HOST=0.0.0.0 -p 8765:8765 "$IMAGE:$TAG"
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8765/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8765/health >/dev/null
          curl -fsS http://127.0.0.1:8765/ready >/dev/null
          BAKED="$(docker exec "$NAME" /app/.venv/bin/python -c 'import crawlutron; print(crawlutron.__version__)')"
          test "$BAKED" = "${{ steps.version.outputs.native }}"

  github-release:
    name: Publish the GitHub release
    needs: [distributions, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build the SBOM from the frozen lock
        run: |
          uv export --frozen --no-dev --no-emit-workspace --format requirements-txt -o /tmp/crawlutron-lock.txt
          uv tool run --from cyclonedx-bom==8.0.1 cyclonedx-py requirements /tmp/crawlutron-lock.txt -o sbom.cdx.json --of json
      - name: Create the release with its notes and SBOM
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            sbom.cdx.json