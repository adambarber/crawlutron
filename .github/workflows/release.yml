name: Release

# TOP-LEVEL, not reusable: PyPI trusted publishing rejects OIDC from inside a
# called workflow, so the job invoking pypi-publish must live here, and the
# trusted publisher on PyPI stays registered against release.yml. Everything
# gate-shaped is reused instead: the first job calls ci.yml, so the gates run
# on the exact tagged commit inside THIS run and `needs` is the gate. That is
# the whole replacement for workflow_run -- no cross-run conclusion lookup,
# no polling, no dangerous trigger.
#
# Two entry points:
#   - push of a v* tag, created by the release App token;
#   - workflow_dispatch, for an owner to retry a release by hand.
# The tag is necessary but not sufficient: the roster only emits packages
# actually tagged at this commit, so a dispatch at an untagged ref publishes
# nothing.
on:
  push:
    tags:
      - "v*"
      - "crawlutron-v*"
      - "crawlutron-core-v*"
      - "crawlutron-extract-v*"
      - "crawlutron-mcp-v*"
      - "crawlutron-rest-v*"
      - "crawlutron-safe-url-v*"
      - "crawlutron-sdk-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to publish (leave empty for this commit)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Component tags at one commit are separate events; one release per commit.
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ci:
    needs: [released]
    if: ${{ needs.released.outputs.primary == 'true' }}
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
      # Codecov's tokenless upload in the called coverage job needs this grant.
      id-token: write

  released:
    name: Resolve the packages this commit released
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    uses: $/.github/workflows/released.yml
    with:
      tag: ${{ inputs.tag }}
    permissions:
      contents: read

  # Build with no OIDC in scope: a build backend executes arbitrary code, and
  # any step in a job holding id-token can mint the publish credential. The
  # publish job below does nothing but download and upload verified artifacts.
  publish-build:
    name: Build ${{ matrix.package.name }} for PyPI
    needs: [released, ci]
    if: ${{ needs.released.outputs.primary == 'true' && needs.released.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.released.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Build and verify distribution
        env:
          SELECTOR: ${{ matrix.package.selector }}
          EXPECTED_VERSION: ${{ matrix.package.version }}
        run: python3 -m scripts.release.build_assert
      - name: Stage the verified distribution
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.package.selector }}
          path: dist/
          if-no-files-found: error

  validate-all:
    name: Validate the complete release set before any upload
    needs: [released, publish-build]
    if: ${{ needs.released.outputs.primary == 'true' && needs.released.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Download every staged distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
      - name: Validate the whole roster before publishing
        env:
          PACKAGES: ${{ needs.released.outputs.packages }}
        run: python3 -m scripts.release.validate_all

  publish:
    name: Publish ${{ matrix.package.name }} to PyPI
    needs: [released, publish-build, validate-all]
    if: ${{ needs.released.outputs.primary == 'true' && needs.released.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      # PEP 740 attestations are signed here, where the OIDC credential lives.
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.released.outputs.packages) }}
    steps:
      - name: Download the verified distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.package.selector }}
          path: dist/
      - name: Publish to PyPI (trusted publishing, OIDC only)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          # A partial upload is resumed, never repeated: file hashes are
          # immutable, so an existing file is the same file.
          skip-existing: true
          # PEP 740 attestations (default since v1.11); pinned explicitly so
          # the capability cannot silently regress.
          attestations: true
      - name: Attest the published distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  install-graph:
    name: Verify ${{ matrix.package.name }} resolves from the published index
    needs: [released, publish]
    if: ${{ needs.released.outputs.primary == 'true' && needs.released.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.released.outputs.packages) }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install the released package and check its graph
        env:
          NAME: ${{ matrix.package.name }}
          VERSION: ${{ matrix.package.version }}
        run: python3 -m scripts.release.install_graph

  image:
    name: Publish the container image
    needs: [released, publish]
    if: ${{ needs.released.outputs.primary == 'true' && needs.released.outputs.root_version != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # Provenance attestation signs the pushed image with OIDC.
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          syft-version: v1.54.0
      - name: Build, smoke, and push the container image
        id: image
        env:
          NATIVE_VERSION: ${{ needs.released.outputs.root_version }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m scripts.release.image
      - name: Attest the SBOM to the pushed image
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/crawlutron
          subject-digest: ${{ steps.image.outputs.digest }}
          sbom-path: ${{ steps.image.outputs.sbom-path }}
          push-to-registry: true

  sbom:
    name: Attach the dependency SBOM to the ${{ matrix.package.name }} release
    needs: [released, publish]
    if: ${{ needs.released.outputs.primary == 'true' && needs.released.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.released.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      - name: Build and attach the SBOM from the frozen lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.package.tag }}
        run: python3 -m scripts.release.sbom

  release-artifacts:
    name: Attach ${{ matrix.package.name }} distributions and checksums
    needs: [released, publish]
    if: ${{ needs.released.outputs.primary == 'true' && needs.released.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.released.outputs.packages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Download the verified distribution
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ matrix.package.selector }}
          path: dist/
      - name: Attach artifacts and their checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.package.tag }}
          SELECTOR: ${{ matrix.package.selector }}
        run: python3 -m scripts.release.release_artifacts