name: Release

# TOP-LEVEL, not reusable: PyPI trusted publishing rejects OIDC from inside a
# called workflow, so the job invoking pypi-publish must live here, and the
# trusted publisher on PyPI stays registered against release.yml. Everything
# gate-shaped is reused instead: the first job calls ci.yml, so the gates run
# on the exact tagged commit inside THIS run and `needs` is the gate. That is
# the whole replacement for workflow_run -- no cross-run conclusion lookup,
# no polling, no dangerous trigger.
#
# Two entry points:
#   - push of a v* tag, created by the release App token;
#   - workflow_dispatch, for an owner to retry a release by hand.
# The tag is necessary but not sufficient: the roster only emits packages
# actually tagged at this commit, so a dispatch at an untagged ref publishes
# nothing.
on:
  push:
    tags:
      - "v*"
      - "crawlutron-v*"
      - "crawlutron-core-v*"
      - "crawlutron-extract-v*"
      - "crawlutron-mcp-v*"
      - "crawlutron-rest-v*"
      - "crawlutron-safe-url-v*"
      - "crawlutron-sdk-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag to publish (leave empty for this commit)
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  # Component tags at one commit are separate events; one release per commit.
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  ci:
    needs: [released]
    if: ${{ needs.released.outputs.primary == 'true' }}
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
      # Codecov's tokenless upload in the called coverage job needs this grant.
      id-token: write

  released:
    name: Resolve the packages this commit released
    if: ${{ github.ref_type == 'tag' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.roster.outputs.packages }}
      root_version: ${{ steps.roster.outputs.root_version }}
      primary: ${{ steps.roster.outputs.primary }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Emit the released packages
        id: roster
        run: |
          set -euo pipefail
          python3 scripts/release_roster.py --released > released.json
          python3 - <<'PY'
          import json
          import os
          import subprocess

          entries = json.load(open("released.json"))
          root = next((entry["version"] for entry in entries if entry["name"] == "crawlutron"), "")
          primary = subprocess.run(
              ["python3", "scripts/release_roster.py", "--primary"],
              cwd=".", capture_output=True, text=True, check=True,
          ).stdout.strip()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"packages={json.dumps(entries)}\n")
              out.write(f"root_version={root}\n")
              out.write(f"primary={primary}\n")
          print(f"{len(entries)} package(s) tagged; root={root or 'not released'}; primary={primary}")
          PY

  # Build with no OIDC in scope: a build backend executes arbitrary code, and
  # any step in a job holding id-token can mint the publish credential. The
  # publish job below does nothing but download and upload verified artifacts.
  publish-build:
    name: Build ${{ matrix.package.name }} for PyPI
    needs: [released, ci]
    if: ${{ needs.released.outputs.primary == 'true' && needs.released.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.released.outputs.packages) }}
    steps:
      # Versions are static in pyproject.toml; tags still bind this build to
      # the exact release commit the artifact assertion checks.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Build only this distribution
        env:
          SELECTOR: ${{ matrix.package.selector }}
        run: uv build --package "$SELECTOR" --out-dir dist
      - name: Assert the artifacts carry the release version
        env:
          EXPECTED_VERSION: ${{ matrix.package.version }}
        run: |
          set -euo pipefail
          python3 - "$EXPECTED_VERSION" <<'PY'
          import email
          import pathlib
          import sys
          import zipfile

          expected = sys.argv[1]
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("no wheel built")
          for wheel in wheels:
              with zipfile.ZipFile(wheel) as archive:
                  metadata = next(n for n in archive.namelist() if n.endswith(".dist-info/METADATA"))
                  version = email.message_from_bytes(archive.read(metadata))["Version"]
              print(f"{wheel.name}: {version}")
              if version != expected:
                  sys.exit(f"{wheel.name} carries {version}, the release is {expected}")
          PY
      - name: Inspect this distribution's artifacts
        run: uvx twine check --strict dist/*
      - name: Stage the verified distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ matrix.package.selector }}
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish ${{ matrix.package.name }} to PyPI
    needs: [released, publish-build]
    if: ${{ needs.released.outputs.primary == 'true' && needs.released.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.released.outputs.packages) }}
    steps:
      - name: Download the verified distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ matrix.package.selector }}
          path: dist/
      - name: Publish to PyPI (trusted publishing, OIDC only)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
          # A partial upload is resumed, never repeated: file hashes are
          # immutable, so an existing file is the same file.
          skip-existing: true

  install-graph:
    name: Verify ${{ matrix.package.name }} resolves from the published index
    needs: [released, publish]
    if: ${{ needs.released.outputs.primary == 'true' && needs.released.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.released.outputs.packages) }}
    steps:
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install the released package and check its graph
        env:
          NAME: ${{ matrix.package.name }}
          VERSION: ${{ matrix.package.version }}
        run: |
          set -euo pipefail
          python -m venv /tmp/probe
          for attempt in $(seq 1 30); do
            if /tmp/probe/bin/pip install --quiet --no-cache-dir "${NAME}==${VERSION}"; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              echo "::error::${NAME}==${VERSION} never resolved from the published index"
              exit 1
            fi
            sleep 10
          done
          /tmp/probe/bin/pip check
          if [ "$NAME" = "crawlutron" ]; then
            /tmp/probe/bin/python -c 'import crawlutron, crawlutron_extract, crawlutron_mcp, crawlutron_rest.main, crawlutron_sdk, safe_url'
          fi

  image:
    name: Publish the container image
    needs: [released, publish]
    if: ${{ needs.released.outputs.primary == 'true' && needs.released.outputs.root_version != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
      # Provenance attestation signs the pushed image with OIDC.
      attestations: write
      id-token: write
    steps:
      # Tags pin the exact release commit; the smoke test checks the static
      # version baked into the image against this release.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Resolve the image tag
        id: version
        env:
          NATIVE_VERSION: ${{ needs.released.outputs.root_version }}
        run: |
          set -euo pipefail
          echo "native=${NATIVE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=$(printf %s "$NATIVE_VERSION" | tr '[:upper:]' '[:lower:]' | tr '+' '-')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the runtime image locally
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          target: runtime
          file: Dockerfile
          # Loaded, never pushed yet: a tag that failed its smoke must not exist.
          push: false
          load: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/crawlutron:${{ steps.version.outputs.tag }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
      - name: Smoke the built image
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
          EXPECTED_VERSION: ${{ steps.version.outputs.native }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/crawlutron:$VERSION_TAG"
          NAME="crawlutron-smoke"
          docker rm -f "$NAME" >/dev/null 2>&1 || true
          docker run -d --name "$NAME" -e CRAWLUTRON_HOST=0.0.0.0 -p 8765:8765 "$IMAGE"
          trap 'docker rm -f "$NAME" >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 15); do
            curl -fsS http://127.0.0.1:8765/health >/dev/null && break
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8765/health >/dev/null; then
            docker logs "$NAME" || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:8765/ready >/dev/null
          BAKED="$(docker exec "$NAME" /app/.venv/bin/python -c 'import crawlutron; print(crawlutron.__version__)')"
          test "$BAKED" = "$EXPECTED_VERSION"
      - name: Push the smoked image
        id: push
        env:
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/crawlutron:$VERSION_TAG"
          docker push "$IMAGE"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Attest the pushed image
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/crawlutron
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  sbom:
    name: Attach the dependency SBOM to the ${{ matrix.package.name }} release
    needs: [released, publish]
    if: ${{ needs.released.outputs.primary == 'true' && needs.released.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.released.outputs.packages) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.tag || github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Build and attach the SBOM from the frozen lock
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.package.tag }}
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --no-emit-workspace --format requirements-txt -o /tmp/crawlutron-lock.txt
          uv tool run --from cyclonedx-bom==8.0.1 cyclonedx-py requirements /tmp/crawlutron-lock.txt -o sbom.cdx.json --of json
          gh release upload "$TAG" sbom.cdx.json --clobber

  release-artifacts:
    name: Attach ${{ matrix.package.name }} distributions and checksums
    needs: [released, publish]
    if: ${{ needs.released.outputs.primary == 'true' && needs.released.outputs.packages != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        package: ${{ fromJSON(needs.released.outputs.packages) }}
    steps:
      - name: Download the verified distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-${{ matrix.package.selector }}
          path: dist/
      - name: Attach artifacts and their checksums to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.package.tag }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.whl *.tar.gz > SHA256SUMS
          gh release upload "$TAG" *.whl *.tar.gz SHA256SUMS --clobber
