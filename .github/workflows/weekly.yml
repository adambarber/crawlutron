name: Weekly

on:
  schedule:
    - cron: "0 4 * * 0"  # Weekly on Sunday 4am UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutation-testing:
    name: Mutation testing (invariant-critical)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare gate environment
        uses: $/.github/actions/prepare

      - name: Run mutation testing on invariant-critical modules
        run: |
          .venv/bin/mutmut run \
            --paths-to-mutate "tests/invariants,packages/core/src/crawlutron/admission_kernel" \
            --runner ".venv/bin/python -m pytest -x -q --tb=line" \
            --tests-dir "tests/invariants" \
            --max-runtime 300

      - name: Generate mutation testing HTML report
        run: .venv/bin/mutmut html

      - name: Upload mutation testing HTML artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: mutation-testing-report
          path: html/
          if-no-files-found: warn

      - name: Upload mutation testing results artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: mutation-testing-results
          path: .mutmut-cache
          if-no-files-found: warn

  lowest-direct-resolution:
    name: Lowest-direct resolution probe
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Compile lowest-direct resolution
        run: uv pip compile --resolution lowest-direct pyproject.toml -o /tmp/lowest-direct.txt --python 3.14

      - name: Create clean virtual environment
        run: uv venv /tmp/lowest-venv --python 3.14 --seed

      - name: Install lowest-direct dependencies
        run: uv pip install --python /tmp/lowest-venv/bin/python -r /tmp/lowest-direct.txt

      - name: Verify all workspace members import successfully
        run: |
          /tmp/lowest-venv/bin/python -c "
          import sys
          packages = [
              'admission',
              'crawlutron',
              'crawlutron_extract',
              'crawlutron_mcp',
              'crawlutron_rest',
              'crawlutron_sdk',
              'safe_url',
          ]
          for pkg in packages:
              try:
                  __import__(pkg.replace('-', '_'))
                  print(f'OK: {pkg}')
              except ImportError as e:
                  print(f'FAIL: {pkg} - {e}')
                  sys.exit(1)
          print('All packages imported successfully')
          "

      - name: Upload resolution probe results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: ${{ always() }}
        with:
          name: lowest-direct-resolution-probe
          path: /tmp/lowest-direct.txt
          if-no-files-found: warn