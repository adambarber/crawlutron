name: Release Please

# Versions and tags are release-please's. This workflow owns the push-to-main
# path: it calls ci.yml first, so release-please never proposes or tags a
# commit that has not passed the gates ON THAT COMMIT -- the old workflow_run
# conclusion check, replaced by `needs` inside a single run.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  release-please:
    name: Propose and tag the next releases
    needs: [ci]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      # For the dispatch handoff below, nothing else.
      actions: write
    steps:
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A bumped version makes uv.lock stale, and the lock gate runs on every
      # commit after this PR lands. Re-lock inside the PR instead of reddening
      # main.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ steps.release.outputs.pr }}
        with:
          enable-cache: false
      - name: Refresh the lock for the bumped versions
        if: ${{ steps.release.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          uv lock
          git add uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "release-please[bot]"
          git config user.email "release-please[bot]@users.noreply.github.com"
          git commit -m "chore: refresh uv.lock for the release versions"
          gh auth setup-git
          git push origin "HEAD:${HEAD_BRANCH}"
      # Tags created with GITHUB_TOKEN fire no push events (GitHub's
      # anti-recursion rule), so the tag just created would never trigger
      # release.yml on its own. workflow_dispatch is the documented exception
      # that the default token MAY fire, so hand the tagged commit over
      # explicitly. The roster in release.yml is still the real guard: it only
      # emits packages actually tagged at this commit.
      # If you switch release-please to an App token/PAT, tags trigger
      # release.yml directly -- delete this step then, or releases run twice.
      - name: Hand the tagged commit to the release workflow
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release.yml --ref "$GITHUB_SHA"
