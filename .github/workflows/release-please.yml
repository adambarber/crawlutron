name: Release Please

# Manual only. ci.yml owns push-to-main directly; this workflow exists to
# propose the release PR and create tags when an owner dispatches it. It calls
# ci.yml first, so release-please never proposes or tags a commit that has not
# passed the gates ON THAT COMMIT -- `needs` inside one run, not a cross-run
# conclusion lookup.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    uses: $/.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read
      # A called job's permissions are capped by the caller's grant: Codecov's
      # tokenless upload needs this on every path, dispatch included.
      id-token: write

  release-please:
    name: Propose and tag the next releases
    needs: [ci]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      # App-created PRs run CI and App-created tags fire release.yml directly.
      # GITHUB_TOKEN does neither (GitHub's anti-recursion rule).
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        id: app-token
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Least privilege: the bot only proposes PRs/tags and pushes the lock.
          permission-contents: write
          permission-pull-requests: write
      - uses: googleapis/release-please-action@8b8fd2cc23b2e18957157a9d923d75aa0c6f6ad5 # v4
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # A bumped version makes uv.lock stale, and the lock gate runs on every
      # commit after this PR lands. Re-lock inside the PR instead of reddening
      # main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ steps.release.outputs.pr }}
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        if: ${{ steps.release.outputs.pr }}
        with:
          enable-cache: false
      - name: Refresh the lock for the bumped versions
        if: ${{ steps.release.outputs.pr }}
        env:
          # The refresh push must also come from the App so the release PR gets
          # CI checks; GITHUB_TOKEN pushes fire no workflow runs.
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          HEAD_BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
        run: |
          set -euo pipefail
          uv lock
          git add uv.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "release-please[bot]"
          git config user.email "release-please[bot]@users.noreply.github.com"
          git commit -m "chore: refresh uv.lock for the release versions"
          gh auth setup-git
          git push origin "HEAD:${HEAD_BRANCH}"

