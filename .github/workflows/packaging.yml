name: Packaging

# Reusable only: ci.yml calls this after the required aggregate, so a red
# commit never reaches it, on any path. It publishes nothing -- no write
# scope, no upload anywhere. release.yml is the only publishing path.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  packaging-distributions:
    name: Build and check every distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Ensure tags are available for version derivation; a tagless tree
      # builds 0.1.devN, which fails the members' >=0.4.0.dev0 floor when the
      # probe resolves them -- so the checkout carries tags, no extra fetch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Build every member
        run: uv build --all-packages --out-dir dist
      - name: Inspect every artifact
        # twine reads the metadata a package index reads: a bad README path, a
        # missing license, an invalid version, or a description that will not
        # render fails here rather than on upload.
        run: uvx twine check --strict dist/*
      - name: Install and import every wheel in a clean environment
        run: uv run --no-project --python 3.14 python -m scripts.check_packaging

  packaging-image:
    name: Build the container image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the runtime image
        # Loaded into the local daemon rather than pushed: this asserts the image
        # still builds after a packaging change, nothing more.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          file: Dockerfile
          push: false
          load: true
          tags: crawlutron:ci
