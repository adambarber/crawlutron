name: Packaging

# Every member of the uv workspace must be publishable, and that is checked on
# every push rather than at release time. Building, inspecting, installing and
# importing each wheel is what a consumer does; a packaging break that only a
# release discovers is a break that reaches a user.
#
# Publishes nothing: this workflow carries no write scope and uploads no artifact
# anywhere. `release.yml` is the only publishing path, and it runs on a tag.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  distributions:
    name: Build and check every distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # hatch-vcs derives the version from the newest tag. A checkout is not
      # guaranteed to carry them, and a tagless tree builds 0.1.devN, which fails
      # the members' `>=0.4.0.dev0` floor when the probe resolves them.
      - name: Fetch the tags the version comes from
        run: git fetch --tags --force
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Build every member
        run: uv build --all-packages --out-dir dist

      - name: Inspect every artifact
        # twine reads the metadata a package index reads: a bad README path, a
        # missing license, an invalid version, or a description that will not
        # render fails here rather than on upload.
        run: uvx twine check --strict dist/*

      - name: Install and import every wheel in a clean environment
        run: uv run --no-project --python 3.14 python scripts/check_packaging.py

  image:
    name: Build the container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the runtime image
        # Loaded into the local daemon rather than pushed: this asserts the image
        # still builds after a packaging change, nothing more.
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          target: runtime
          file: Dockerfile
          push: false
          load: true
          tags: crawlutron:ci