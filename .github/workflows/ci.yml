name: CI

# GitHub only loads workflows from a repository root's .github/workflows/. This
# file lives inside the service because the service carries its own tooling, and
# it is written for the layout where the service IS that repository: every path
# below is relative to the root and carries no parent-directory prefix, because
# the extraction is a file copy and a prefix naming a directory that will not
# exist there is the one thing a copy cannot carry. The jobs need no
# `working-directory` for the same reason -- the root is already the service.
# tests/test_ci_enforcement.py (via tests/_ci_contract.py) asserts both.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Kept so the suite can be re-run on demand against a given ref without
  # opening a PR. It is no longer what makes test-browser reachable: that job
  # used to be `if: github.event_name == 'workflow_dispatch'`, so every push and
  # pull request silently skipped it -- declared, never run, green.
  workflow_dispatch:

# #624: CI needs no write scope -- it reports results, it never pushes.
# Declaring read-all removes the default write-all token scope a compromised
# step could otherwise use.
permissions: read-all

jobs:
  enforcement:
    name: Pre-commit enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: pyproject.toml
      # The venv is the service's own, because the hook entries resolve
      # `.venv/bin/python` relative to the service root. Every hook is
      # `language: system`, so this is the only place the tools come from.
      # Installed from the frozen lock (#622): an unpinned install would
      # re-resolve the transitive graph at install time.
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install CI hook environment
        run: uv sync --frozen --extra dev
      # Gate state the hooks persist across runs: mypy's incremental cache,
      # ruff's cache and the gate-fanout status dir. Keyed on lock+pyproject
      # so a dependency or config bump invalidates (mirrors the Camoufox
      # cache pattern: key on the pin, re-validate on a miss).
      - name: Cache gate state
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .mypy_cache
            .ruff_cache
            .gate_fanout
          key: gate-state-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
      - name: Run all configured hooks
        run: pre-commit run --all-files --config .pre-commit-config.yaml

  test-fast:
    name: Test suite (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install package + dev dependencies
        run: uv sync --frozen --extra dev
      # Precompile bytecode once so every xdist worker reuses .pyc instead of
      # recompiling ~90k lines per run (S4).
      - name: Precompile bytecode
        run: python3 -m compileall -q crawlutron tests scripts
      # Includes the project-specific safety predicates (tests/invariants/ and
      # friends): those detectors are the only exit path for the chokepoint
      # rules, and they run inside the default marker set.
      - name: Run pytest (fast)
        run: python3 -m pytest

  test-browser:
    name: Test suite (browser)
    runs-on: ubuntu-latest
    # Required. It was held back pending evidence that it can actually go green,
    # and that evidence now exists: 8 passed against a known-good commit, and
    # all 8 fail when BrowserRenderer.render is short-circuited, so the green
    # reflects a real browser rather than a double. The suite costs ~20s here
    # and a Camoufox fetch, which is cheap enough to pay on every push.
    #
    # It selects ONLY the `browser` marker: the job exists to run the
    # browser suite, and any wider filter re-runs the fast suite (~3,400
    # tests) on every push.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install package + dev dependencies
        run: uv sync --frozen --extra dev
      # Camoufox downloads ~200 MB of Firefox on first use (#490). The binary
      # lands in the platform cache dir (camoufox.utils.INSTALL_DIR --
      # ~/.cache/camoufox on Linux) and is version-locked by the pin in
      # pyproject.toml, so a cache keyed on that pin skips the fetch on warm
      # runs and the fetch itself re-validates the files on a miss.
      - name: Cache Camoufox browser binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install Camoufox browser binary
        run: python3 -m camoufox fetch
      - name: Run pytest (browser)
    # Selects the `browser` marker, and only that. The previous `-m "not
    # slow"` admitted the whole fast suite (the fast job already runs it),
    # re-running ~3,400 tests per push in a job that exists to add one
    # marker. This still keeps `--strict-markers` and the rest of the
    # addopts configuration intact.
        run: python3 -m pytest -m "browser"

  # #623: dependency audit against the frozen lock. The export/pip-audit tools
  # install inside CI's runner (owner-bandwidth is irrelevant there); the DB
  # fetch is GitHub's advisory DB on their side.
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Audit the frozen lock
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt -o /tmp/lock.txt
          uv tool run pip-audit -r /tmp/lock.txt --strict

  # #623: secret scanning over the whole tree and its history.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One required check. A repository ruleset should require exactly
  # this job: GitHub treats a skipped job as success, so the individual jobs
  # stay unconditional and this aggregate fails if any of them did not succeed.
  # The gate-carrying jobs are enforcement (every pre-commit hook), test-fast
  # (the suite), test-browser (the Camoufox suite), audit and secret-scan (#623); there is no separate lint
  # or typecheck job because pre-commit already runs ruff, mypy and basedpyright
  # inside `enforcement`.
  required:
    name: Required quality gate
    if: ${{ always() }}
    needs: [enforcement, test-fast, test-browser, audit, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate to have succeeded
        # Declared, not inherited. The script below is a chain of `test` lines,
        # and a shell without errexit hands the step the exit code of its LAST
        # line -- so a failed need in the middle would be reported as a passing
        # required check. GitHub's implicit Linux default happens to be
        # `bash -e {0}`, which is why this worked unnoticed; a `defaults.run.shell`,
        # a step-level `shell:`, or a different runner takes it away silently.
        shell: bash -e {0}
        run: |
          test "${{ needs.enforcement.result }}" = "success"
          test "${{ needs.test-fast.result }}" = "success"
          test "${{ needs.test-browser.result }}" = "success"
          test "${{ needs.audit.result }}" = "success"
          test "${{ needs.secret-scan.result }}" = "success"
