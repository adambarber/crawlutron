name: CI

# The gates, and nothing else. This file is the single definition of "green".
#
# Pull requests run it top-level, so the required check keeps its name.
# Pushes to main run it top-level too: release-please is dispatch-only now, so
# this is the single push entry point. Tag pushes still enter through
# release.yml, which calls this workflow as its first job. Both callers run
# the gates on the exact commit inside their own run, and `needs` -- not a
# cross-run conclusion lookup -- is the gate. A `push` trigger here would
# otherwise run the whole battery a second time per commit; it no longer does.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]   # tag pushes enter through release.yml, never here
  workflow_call:
  # Kept so the suite can be re-run on demand against a given ref without
  # opening a PR.
  workflow_dispatch:

# #624: CI needs no write scope -- it reports results, it never pushes.
# Declared as the two scopes the jobs actually read (zizmor: read-all is overly
# broad); a step that gains a new scope must name it here.
permissions:
  contents: read
  pull-requests: read

# PR runs cancel superseded pushes; caller runs (dispatch/tag) keep their own
# group so a release never cancels or queues behind a top-level push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      core-storage: ${{ steps.filter.outputs.core-storage }}
      tests: ${{ steps.filter.outputs.tests }}
      lockfile: ${{ steps.filter.outputs.lockfile }}
      browser: ${{ steps.filter.outputs.browser }}
      packaging: ${{ steps.filter.outputs.packaging }}
      real-pbkdf2: ${{ github.event_name != 'pull_request' || steps.filter.outputs.core-storage == 'true' || steps.filter.outputs.tests == 'true' || steps.filter.outputs.lockfile == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            core-storage:
              - 'packages/core/src/crawlutron/storage/**'
            tests:
              - 'tests/**'
            lockfile:
              - 'uv.lock'
            browser:
              - 'packages/core/src/crawlutron/transport/browser*.py'
              - 'packages/core/src/crawlutron/transport/browser_*.py'
              - 'tests/transport/test_browser*.py'
              - 'tests/transport/test_browser_*.py'
            packaging:
              - 'pyproject.toml'
              - 'packages/**/pyproject.toml'
              - 'Dockerfile'
              - '.dockerignore'

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: actionlint
        run: .venv/bin/pre-commit run actionlint --all-files

  ruff:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: ruff
        run: .venv/bin/pre-commit run ruff --all-files

  ruff-format:
    name: ruff format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: ruff format
        run: .venv/bin/pre-commit run ruff-format --all-files

  basedpyright:
    name: basedpyright
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: basedpyright
        run: .venv/bin/pre-commit run basedpyright --all-files

  jscpd:
    name: jscpd
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: jscpd
        run: .venv/bin/pre-commit run jscpd --all-files

  mypy:
    name: mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: mypy
        run: .venv/bin/pre-commit run mypy --all-files

  lock:
    name: Lock freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: lock
        run: .venv/bin/pre-commit run lock --all-files

  vulture:
    name: vulture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: vulture
        run: .venv/bin/pre-commit run vulture --all-files

  battery:
    name: Test suite (battery)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The battery is the ONLY fast-suite execution. It runs with coverage
    # via PYTEST_ADDOPTS and uploads .coverage* + junit artifacts for the
    # report-only coverage job to consume.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: $/.github/actions/prepare
      # #949: on a cold-cache runner the battery's first imports are compile
      # misses. Precompiling bytecode over the derived member src roots turns
      # them into .pyc hits (the S4 pattern) so the run starts warm.
      - name: Pre-warm bytecode for the battery
        run: .venv/bin/python -m compileall -q packages/*/src tests scripts
      - uses: $/.github/actions/run-tests
      - name: Upload coverage data artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-data
          path: .coverage*
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload junit artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: junit-results
          path: junit-*.xml
          if-no-files-found: error

  # Report-only coverage job: consumes artifacts from battery, real-pbkdf2, and
  # test-browser; never re-runs tests. Combines coverage data, invokes the
  # frozen scripts/coverage_reports.py CLI, emits one artifact, and does
  # per-surface Codecov uploads with informational status.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    if: ${{ always() }}
    needs: [changes, battery, real-pbkdf2, test-browser]
    permissions:
      contents: read
      pull-requests: read
      # Codecov tokenless OIDC upload; ignored by every other job.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: Download battery coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() }}
        with:
          name: coverage-data
          path: .
      - name: Download battery junit results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() }}
        with:
          name: junit-results
          path: junit/battery
      - name: Download real-pbkdf2 coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() && needs.changes.outputs.real-pbkdf2 == 'true' }}
        with:
          name: coverage-data-real-pbkdf2
          path: .
      - name: Download real-pbkdf2 junit results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() && needs.changes.outputs.real-pbkdf2 == 'true' }}
        with:
          name: junit-real-pbkdf2
          path: junit/real-pbkdf2
      - name: Download test-browser coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() && needs.test-browser.result != 'skipped' }}
        with:
          name: coverage-data-test-browser
          path: .
      - name: Download test-browser junit results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() && needs.test-browser.result != 'skipped' }}
        with:
          name: junit-test-browser
          path: junit/test-browser
      - name: Split battery JUnit by test family
        run: .venv/bin/python -m scripts.split_junit junit/battery junit/split
      - name: Combine coverage data
        run: .venv/bin/python -m coverage combine
      - name: Generate coverage reports
        run: .venv/bin/python -m scripts.coverage_reports
      - name: Upload coverage XML to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage_reports/coverage.xml
          flags: battery
          use_oidc: true
          fail_ci_if_error: false
      - name: Upload combined coverage report artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-report
          path: coverage_reports/
          if-no-files-found: error
      # Per-surface Codecov uploads with informational status.
      # Uses !cancelled() so uploads run even when a prior job failed.
      - name: Upload behavioral test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: junit/split/behavioral/junit-*.xml
          flags: behavioral
          report_type: test_results
          use_oidc: true
          fail_ci_if_error: false
      - name: Upload invariant test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: junit/split/invariants/junit-*.xml
          flags: invariants
          report_type: test_results
          use_oidc: true
          fail_ci_if_error: false
      - name: Upload real-pbkdf2 coverage to Codecov
        if: ${{ !cancelled() && needs.changes.outputs.real-pbkdf2 == 'true' }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: junit/real-pbkdf2/junit-real-pbkdf2-*.xml
          flags: real-pbkdf2
          report_type: test_results
          use_oidc: true
          fail_ci_if_error: false
      - name: Upload test-browser coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: junit/test-browser/junit-test-browser-*.xml
          flags: test-browser
          report_type: test_results
          use_oidc: true
          fail_ci_if_error: false

  # The battery deselects `real_pbkdf2`, so the real 210k-iteration PBKDF2 path
  # in storage/caller_key_store.py is never exercised by commit admission. This
  # job runs that surface alone; the 1_000-iteration autouse clamp stays in
  # place for the fast battery and is not weakened.
  # Runs with coverage and uploads data artifact for the report-only coverage job.
  # The job always reports a result so the required gate never sees "skipped";
  # its test step is filtered to core storage paths + tests + lockfile on PRs.
  real-pbkdf2:
    name: Test suite (real PBKDF2)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [changes]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - uses: $/.github/actions/run-tests
        with:
          marker: "real_pbkdf2"
      - name: Upload coverage data artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-data-real-pbkdf2
          path: .coverage*
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload junit artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: junit-real-pbkdf2
          path: junit-real-pbkdf2-*.xml
          if-no-files-found: error

  test-browser:
    name: Test suite (browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Required. 8 passed against a known-good commit, and all 8 fail when
    # BrowserRenderer.render is short-circuited, so the green reflects a real
    # browser rather than a double. It selects ONLY the `browser` marker: any
    # wider filter re-runs the fast suite (~6,300 tests) on every push.
    # Gated on PRs via changes job (browser paths); UNCONDITIONAL on main push and release calls.
    needs: [changes]
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - uses: $/.github/actions/prepare-browser
      - uses: $/.github/actions/run-tests
        with:
          browser: true
          marker: ${{ github.event_name == 'pull_request' && 'browser' || 'not (browser or slow or real_pbkdf2)' }}
      - name: Upload coverage data artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: coverage-data-test-browser
          path: .coverage*
          if-no-files-found: error
          include-hidden-files: true
      - name: Upload junit artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ always() }}
        with:
          name: junit-test-browser
          path: junit-test-browser-*.xml
          if-no-files-found: error

  # #623: dependency audit against the frozen lock. The export/pip-audit tools
  # install inside CI's runner (owner-bandwidth is irrelevant there); the DB
  # fetch is GitHub's advisory DB on their side.
  # enable-cache: true for uv cache -- zizmor exception: this cache is read-only
  # and scoped to the audit job; it does not affect gate integrity. Owner applies
  # the exception via zizmor config; do not self-exempt.
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Audit the frozen lock
        env:
          # Refuse source builds outright: a missing wheel fails immediately
          # and legibly instead of twenty seconds into a compiler subprocess.
          PIP_ONLY_BINARY: ":all:"
        run: |
          uv export --frozen --no-dev --no-emit-workspace --format requirements-txt --python 3.12 -o /tmp/lock.txt
          uv tool run --python 3.12 pip-audit -r /tmp/lock.txt --strict

  # #623: secret scanning over the whole tree and its history.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: false
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A gate like any other: no `needs`. It must not need `required`, because
  # `required` needs zizmor -- that would be a cycle GitHub refuses to start.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: zizmor
        run: .venv/bin/pre-commit run zizmor --all-files

  pin-verify:
    name: pin-verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: pin-verify check
        run: .venv/bin/pre-commit run pin-verify --all-files

  pin-freshness:
    name: pin-freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: pin-verify latest-stable check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .venv/bin/python -m scripts.pin_verify outdated

  # Dependency review -- checks for vulnerable/malicious dependencies in PRs.
  # SHA-pinned, contents:read only. Runs on all PRs and main pushes.
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout trusted tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          config-file: '.github/dependency-review-config.yml'
          base-ref: ${{ github.event.before && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event.pull_request.base.sha || github.sha }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}

  # One required check, and only on the PR path (this workflow runs top-level
  # there, so the check name is unchanged). GitHub treats a skipped job as
  # success, so the gates stay unconditional and this aggregate fails if any
  # of them did not succeed. When this workflow is *called*, the aggregate is
  # redundant -- any failed job fails the call -- but harmless.
  required:
    name: Required quality gate
    if: ${{ always() }}
    needs:
      - actionlint
      - ruff
      - ruff-format
      - basedpyright
      - jscpd
      - lock
      - mypy
      - vulture
      - battery
      - coverage
      - real-pbkdf2
      - test-browser
      - audit
      - secret-scan
      - zizmor
      - pin-verify
      - pin-freshness
      - dependency-review
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every gate to have succeeded
        # Declared, not inherited: without errexit the step returns the exit
        # code of its LAST test line, so a failed need in the middle would be
        # reported as a passing required check.
        shell: bash -e {0}
        run: |
          test "${{ needs.actionlint.result }}" = "success"
          test "${{ needs.ruff.result }}" = "success"
          test "${{ needs.ruff-format.result }}" = "success"
          test "${{ needs.basedpyright.result }}" = "success"
          test "${{ needs.jscpd.result }}" = "success"
          test "${{ needs.lock.result }}" = "success"
          test "${{ needs.mypy.result }}" = "success"
          test "${{ needs.vulture.result }}" = "success"
          test "${{ needs.battery.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"
          test "${{ needs.real-pbkdf2.result }}" = "success"
          test "${{ needs.test-browser.result }}" = "success"
          test "${{ needs.audit.result }}" = "success"
          test "${{ needs.secret-scan.result }}" = "success"
          test "${{ needs.zizmor.result }}" = "success"
          test "${{ needs.pin-verify.result }}" = "success"
          test "${{ needs.pin-freshness.result }}" = "success"
          test "${{ needs.dependency-review.result }}" = "success"
          # Filtered surfaces are no-op steps inside jobs that still report
          # success; a skipped job would fail this aggregate by design.

  # Dev builds go to TestPyPI on green main pushes only. Trusted publishing
  # rejects OIDC from a called workflow, so both jobs live here at top level;
  # the guard is load-bearing and must not be widened to dispatch or tags.
  # Skip only when every declared distribution is already on TestPyPI; a new
  # member with an existing root version must still publish.
  testpypi-build:
    name: Build dev distributions for TestPyPI
    needs: [required]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      skip-build: ${{ steps.check-version.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          fetch-tags: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false
      # The decision is a pure door over every declared distribution's version;
      # release-please owns those versions, no CI step rewrites them.
      - name: Check if every declared version exists on TestPyPI
        id: check-version
        run: |
          set -euo pipefail
          SKIP="$(uv run --no-project --python 3.12 python scripts/testpypi_guard.py --index-url https://test.pypi.org)"
          echo "skip=${SKIP}" >> "${GITHUB_OUTPUT}"
          echo "TestPyPI build skip: ${SKIP}"
      - name: Build and inspect every distribution
        if: ${{ steps.check-version.outputs.skip != 'true' }}
        run: |
          set -euo pipefail
          uv build --all-packages --out-dir dist
          uvx twine check --strict dist/*
      - name: Stage the dev distributions
        if: ${{ steps.check-version.outputs.skip != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish dev builds to TestPyPI
    needs: [testpypi-build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.testpypi-build.outputs.skip-build != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: testpypi
    permissions:
      contents: read
      # TestPyPI trusted publishing mints its short-lived OIDC token here.
      id-token: write
    steps:
      - name: Download the dev distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dev-dist
          path: dist/
      - name: Publish to TestPyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # Packaging is downstream of every gate on every path (PR, main, tag), and
  # publishes nothing. Calling it from here means the release workflows get
  # it too, without re-declaring the ordering.
  packaging:
    needs: [required]
    uses: $/.github/workflows/packaging.yml
    permissions:
      contents: read