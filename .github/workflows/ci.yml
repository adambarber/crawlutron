name: CI

# The gates, and nothing else. This file is the single definition of "green".
#
# Pull requests run it top-level, so the required check keeps its name.
# Pushes to main run it top-level too: release-please is dispatch-only now, so
# this is the single push entry point. Tag pushes still enter through
# release.yml, which calls this workflow as its first job. Both callers run
# the gates on the exact commit inside their own run, and `needs` -- not a
# cross-run conclusion lookup -- is the gate. A `push` trigger here would
# otherwise run the whole battery a second time per commit; it no longer does.
#
# One job per gate, and every gate job runs ITS HOOK: `pre-commit run <id>
# --all-files`. The gate's definition lives exactly once, in
# .pre-commit-config.yaml, so CI cannot drift from what a local commit runs.
# Coverage is the one measurement job that runs pytest directly (no new hook)
# and uploads to Codecov.
# There is no wrapper job: a single `pre-commit run --all-files` fans every
# gate out inside one runner, so the battery's xdist workers fought the other
# gates for the same cores and hit the wall clock. The contract test
# (tests/test_ci_enforcement.py via tests/_ci_contract.py) fails if a hook has
# no job, or if a job re-runs a command the hook owns. Every path is
# root-relative and no job sets working-directory: the service IS the
# repository, and the contract test asserts both.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]   # tag pushes enter through release.yml, never here
  workflow_call:
  # Kept so the suite can be re-run on demand against a given ref without
  # opening a PR.
  workflow_dispatch:

# #624: CI needs no write scope -- it reports results, it never pushes.
# Declared as the two scopes the jobs actually read (zizmor: read-all is overly
# broad); a step that gains a new scope must name it here.
permissions:
  contents: read
  pull-requests: read

# PR runs cancel superseded pushes; caller runs (dispatch/tag) keep their own
# group so a release never cancels or queues behind a top-level push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: ruff
        run: .venv/bin/pre-commit run ruff --all-files

  ruff-format:
    name: ruff format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: ruff format
        run: .venv/bin/pre-commit run ruff-format --all-files

  basedpyright:
    name: basedpyright
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: basedpyright
        run: .venv/bin/pre-commit run basedpyright --all-files

  jscpd:
    name: jscpd
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: jscpd
        run: .venv/bin/pre-commit run jscpd --all-files

  mypy:
    name: mypy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: mypy
        run: .venv/bin/pre-commit run mypy --all-files

  lock:
    name: Lock freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: lock
        run: .venv/bin/pre-commit run lock --all-files

  vulture:
    name: vulture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: vulture
        run: .venv/bin/pre-commit run vulture --all-files

  battery:
    name: Test suite (battery)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: $/.github/actions/prepare
      # #949: on a cold-cache runner the battery's first imports are compile
      # misses. Precompiling bytecode over the derived member src roots turns
      # them into .pyc hits (the S4 pattern) so the run starts warm.
      - name: Pre-warm bytecode for the battery
        run: .venv/bin/python -m compileall -q packages/*/src tests scripts
      - name: battery
        run: .venv/bin/pre-commit run battery --all-files
        env:
          # The battery is the one gate that legitimately runs for a minute:
          # ~50s warm, longer on a cold runner. The fan-out wall exists to stop
          # a hung gate hanging the job forever, so it gets hang-guard room
          # here rather than a budget. Commit admission keeps the 60s default.
          GATE_FANOUT_WALL_SECONDS: "300"

  # CI-only measurement. The pre-commit set is deliberately untouched: this
  # job runs the battery's selection under coverage and uploads to Codecov.
  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
      # Codecov tokenless OIDC upload; ignored by every other job.
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: Measure the battery's coverage
        run: .venv/bin/python -m pytest -q -m "not (browser or slow or real_pbkdf2)" --cov=crawlutron --cov-report=xml --cov-report=term-missing
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: battery
          use_oidc: true
          # An upload hiccup must never redden a contributor's PR.
          fail_ci_if_error: false

  # The battery deselects `real_pbkdf2`, so the real 210k-iteration PBKDF2 path
  # in storage/caller_key_store.py is never exercised by commit admission. This
  # job runs that surface alone; the 1_000-iteration autouse clamp stays in
  # place for the fast battery and is not weakened.
  real-pbkdf2:
    name: Test suite (real PBKDF2)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: Run pytest (real PBKDF2)
        run: .venv/bin/python -m pytest -m "real_pbkdf2"

  test-browser:
    name: Test suite (browser)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Required. 8 passed against a known-good commit, and all 8 fail when
    # BrowserRenderer.render is short-circuited, so the green reflects a real
    # browser rather than a double. It selects ONLY the `browser` marker: any
    # wider filter re-runs the fast suite (~5,700 tests) on every push.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          # prepare's `uv sync` builds the editable install, and hatch-vcs
          # derives its version from tags -- a tagless tree builds 0.1.devN.
          fetch-tags: true
          persist-credentials: false
      - uses: $/.github/actions/prepare
      # camoufox fetch installs this model, but the browser-binary cache skips
      # fetch on warm runs while the venv is rebuilt every run. Install it here
      # so no hermetic test ever triggers a GitHub download itself.
      - name: Install pinned fpgen fingerprint model
        run: .venv/bin/python -c "from camoufox.fpgen_model import ensure_fpgen_model; ensure_fpgen_model()"
      # Camoufox downloads ~200 MB of Firefox on first use (#490). The binary
      # lands in ~/.cache/camoufox and is version-locked by the pin in
      # pyproject.toml, so a cache keyed on that pin skips the fetch on warm
      # runs. NOT lookup-only: that skips the download (the cache would be
      # saved but never read) and the fetch would run on every push.
      - name: Cache Camoufox browser binary
        id: camoufox
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cache/camoufox
          key: camoufox-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
      - name: Install Camoufox browser binary
        if: ${{ steps.camoufox.outputs.cache-hit != 'true' }}
        run: .venv/bin/python -m camoufox fetch
        env:
          # camoufox resolves its release through the GitHub API, which answers
          # an unauthenticated runner at 60 req/h: the fetch 403s on a busy
          # day. The job's own token lifts it to the repository's rate limit.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: $/.github/actions/prepare-browser
      # Firefox on a bare ubuntu-24.04 runner needs an X server and its runtime
      # libraries; xvfb-run provides both (camoufox CI does the same).
      - name: Run pytest (browser)
        env:
          # Firefox on GitHub Actions ubuntu-24.04 cannot connect to the
          # in-process test server at 127.0.0.1 -- network_error on every
          # navigation. Two causes, both fixed here:
          #   NO_PROXY:  Firefox honors system proxy env vars; without this
          #            it may try to proxy localhost through a nonexistent proxy.
          #   CRAWLUTRON_HEADLESS=false: boolean headless Firefox on Linux has
          #            limited networking; headed mode under xvfb-run matches
          #            camoufox's own CI and works reliably.
          NO_PROXY: 127.0.0.1,localhost
          CRAWLUTRON_HEADLESS: "false"
        run: xvfb-run -a .venv/bin/python -m pytest -m "browser"
  # #623: dependency audit against the frozen lock. The export/pip-audit tools
  # install inside CI's runner (owner-bandwidth is irrelevant there); the DB
  # fetch is GitHub's advisory DB on their side.
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
          cache-dependency-glob: uv.lock
      - name: Audit the frozen lock
        env:
          # Refuse source builds outright: a missing wheel fails immediately
          # and legibly instead of twenty seconds into a compiler subprocess.
          PIP_ONLY_BINARY: ":all:"
        run: |
          uv export --frozen --no-dev --no-emit-workspace --format requirements-txt --python 3.14 -o /tmp/lock.txt
          uv tool run --python 3.14 pip-audit -r /tmp/lock.txt --strict

  # #623: secret scanning over the whole tree and its history.
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A gate like any other: no `needs`. It must not need `required`, because
  # `required` needs zizmor -- that would be a cycle GitHub refuses to start.
  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: $/.github/actions/prepare
      - name: zizmor
        run: .venv/bin/pre-commit run zizmor --all-files

  # One required check, and only on the PR path (this workflow runs top-level
  # there, so the check name is unchanged). GitHub treats a skipped job as
  # success, so the gates stay unconditional and this aggregate fails if any
  # of them did not succeed. When this workflow is *called*, the aggregate is
  # redundant -- any failed job fails the call -- but harmless.
  required:
    name: Required quality gate
    if: ${{ always() }}
    needs:
      - ruff
      - ruff-format
      - basedpyright
      - jscpd
      - lock
      - mypy
      - vulture
      - battery
      - coverage
      - real-pbkdf2
      - test-browser
      - audit
      - secret-scan
      - zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require every gate to have succeeded
        # Declared, not inherited: without errexit the step returns the exit
        # code of its LAST test line, so a failed need in the middle would be
        # reported as a passing required check.
        shell: bash -e {0}
        run: |
          test "${{ needs.ruff.result }}" = "success"
          test "${{ needs.ruff-format.result }}" = "success"
          test "${{ needs.basedpyright.result }}" = "success"
          test "${{ needs.jscpd.result }}" = "success"
          test "${{ needs.lock.result }}" = "success"
          test "${{ needs.mypy.result }}" = "success"
          test "${{ needs.vulture.result }}" = "success"
          test "${{ needs.battery.result }}" = "success"
          test "${{ needs.coverage.result }}" = "success"
          test "${{ needs.real-pbkdf2.result }}" = "success"
          test "${{ needs.test-browser.result }}" = "success"
          test "${{ needs.audit.result }}" = "success"
          test "${{ needs.secret-scan.result }}" = "success"
          test "${{ needs.zizmor.result }}" = "success"

  # Dev builds go to TestPyPI on green main pushes only. Trusted publishing
  # rejects OIDC from a called workflow, so both jobs live here at top level;
  # the guard is load-bearing and must not be widened to dispatch or tags.
  testpypi-build:
    name: Build dev distributions for TestPyPI
    needs: [required]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      # Release-please owns the declared version in every pyproject; no CI step
      # rewrites it. A repeat push reuses the declared version and `skip-existing`
      # makes the TestPyPI upload a no-op until release-please bumps it.
      - name: Build and inspect every distribution
        run: |
          set -euo pipefail
          uv build --all-packages --out-dir dist
          uvx twine check --strict dist/*
      - name: Stage the dev distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dev-dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish dev builds to TestPyPI
    needs: [testpypi-build]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the dev distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dev-dist
          path: dist/
      - name: Publish to TestPyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  # Packaging is downstream of every gate on every path (PR, main, tag), and
  # publishes nothing. Calling it from here means the release workflows get
  # it too, without re-declaring the ordering.
  packaging:
    needs: [required]
    uses: $/.github/workflows/packaging.yml
    permissions:
      contents: read
