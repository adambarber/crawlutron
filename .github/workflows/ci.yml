name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install ruff
        run: pip install "ruff>=0.5"
      - name: Run ruff (new code — app/api + app/main.py must be clean)
        run: ruff check app/api app/main.py
      - name: Run ruff format check (new code)
        run: ruff format --check app/api app/main.py
      # Legacy app/crawl + tests still carry style debt (E402, F821, S110, etc.)
      # tracked in the 652-error backlog; gate only new code until the
      # extraction backlog is cleared. Full-tree check is advisory:
      - name: Advisory full-tree ruff (non-blocking)
        run: ruff check app tests || true
      - name: Advisory full-tree format (non-blocking)
        run: ruff format --check app tests || true

  test-fast:
    name: Test suite (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"
      - name: Run pytest (fast)
        run: python3 -m pytest

  test-browser:
    name: Test suite (browser, opt-in)
    runs-on: ubuntu-latest
    # Default to skip; set the workflow_dispatch / run workflow UI to
    # trigger this job explicitly when the Camoufox binary is available.
    if: ${{ github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"
      - name: Install Camoufox browser binary
        run: python3 -m camoufox fetch
      - name: Run pytest (full)
        run: python3 -m pytest -o addopts=
