[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-crawler"
version = "0.3.0"
description = "Policy-driven, self-hosted web crawler and content-extraction service built around FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "browser-crawler maintainers" },
]
keywords = [
    "crawler",
    "scraper",
    "fastapi",
    "browser",
    "ssrf-protection",
    "camoufox",
    "extraction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "fastapi>=0.124",
    "uvicorn[standard]>=0.38",
    "camoufox[asyncio]>=0.3.0",
    "curl_cffi>=0.7.0",
    "trafilatura>=2.0",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.0",
    "pdfplumber>=0.11.0",
    "charset-normalizer>=3.3.0",
    "h2>=4.1.0",
    "httpx>=0.27.0",
    "brotli>=1.1.0",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "pydantic>=2.0",
    # Local DBAPI schema migrations only; the package documents no network or telemetry behavior.
    "yoyo-migrations==9.0.0",
    # Bounded-execution regex engine (app/safe_regex.py): stdlib re cannot be
    # interrupted (GIL wedge) -- correctness/security needs the native timeout.
    "regex>=2026.5.9",
    # Public-suffix dataset for registrable_domain (app/validation.py):
    # without it the suffix heuristic silently degrades.
    "publicsuffixlist>=1.0.2",
]

[project.optional-dependencies]
# Lint and type tools are PINNED, not ranged. These are gates: a floating
# version means a new release can turn a build red with no repository change,
# and the local venv and CI can disagree about what "clean" means. The test
# packages stay ranged — they do not decide pass/fail on their own.
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.10",
    "pytest-xdist>=3.0",
    "pytest-randomly>=4.0",
    "ruff==0.16.8",
    "jscpd==5.3.2",
    "pre-commit==4.6.2",
    # Read by tests/test_precommit_ci_contract.py, which parses the pre-commit
    # config and the CI workflow as YAML rather than by regex over their text.
    # It was previously present only as a transitive dependency of pre-commit,
    # which is not a reason for a test to depend on it.
    "pyyaml>=6.0",
    # Static type-checking. The app tree IS mypy-clean (0 errors across 85
    # files) and `typecheck` now runs in CI as a required gate, so this is a
    # real gate, not an advisory one — the old comment claiming otherwise was
    # stale and would have told the next reader to ignore type errors.
    "brotli-stubs==1.2.0",
    "types-regex==2026.9.10.20260911",
    "types-lxml==2026.2.16",
    "mypy==2.3.1",
    # The third type checker, and the only one that sees annotation lies mypy
    # structurally cannot here. It was pinned only in requirements-dev.txt, which
    # no workflow reads: CI installs this extra, so pyright was absent there and
    # tests/test_pyright_budget.py -- a fail gate on it -- skipped in both the
    # `typecheck` job and the pre-commit hook while reporting success. Pinned for
    # the same reason as mypy: a new release must not turn a build red with no
    # repository change.
    "pyright==1.1.406",
]

[project.urls]
# TODO: replace the placeholder org before publishing; these URLs are not yet
# a real remote.
Homepage = "https://github.com/browser-crawler/browser-crawler"
Issues = "https://github.com/browser-crawler/browser-crawler/issues"
Changelog = "https://github.com/browser-crawler/browser-crawler/blob/main/CHANGELOG.md"
Security = "https://github.com/browser-crawler/browser-crawler/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
preview = true
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "C901",
    "PLR0912",
    "PLR0915",
]
ignore = [
    "E501",  # line length (handled by formatter)
    "E302",
    "E303",
    "E306",
    "E117",
    "W391",
    "B903",
    "S101",  # use of assert (acceptable in tests)
]
# B008: FastAPI dependency injection passes Depends(...) as a default argument
# by design; calls listed here are recognized as immutable by bugbear.
# S311: random.uniform jitter in the scheduler is throughput shaping, not crypto.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["Depends", "fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Header"]

# Complexity ratchets. These are 10% UNDER the worst offender in app/ at the time
# of writing, not round numbers, because a round number is a number nobody
# re-derived: the point is that every threshold names a function that exists and
# is still too big. Measure with
#   ruff check --isolated --preview --select C901,PLR0912,PLR0915 --output-format concise app
# and take the top value per rule; read it as the CURRENT worst.
#
# The thresholds ship with the refactor that brought the tree under them, not
# after it. Setting them above the pre-refactor worst would let the next wave
# start already red, which trains people to expect red and to re-baseline it.
#
# History: 42 / 46 / 164 before the HTTP subsystem split. The split took
# _http_strategy_result (the 164-statement monolith) to 5 / 4 / 17, which left
# _run_job as the worst offender at 30 / 31 / 87, so the thresholds came down to
# exactly that. Lowering them here rather than later is the rule: a ratchet that
# waits for a cleanup phase is a ratchet nobody pulls.
#
# Each tightening hands the next wave its target for free. _run_job is the
# subject of the job-runner split, and when it comes down the next-worst moves
# again, so this block is expected to keep coming down.
[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pylint]
max-branches = 31
max-statements = 87
# PLR0911 (returns) and PLR0913 (arguments) are still unselected. Their maxima
# are 10 and 24, against the 9 and 21 that a 10%-under ratchet would demand, and
# both are the same two functions: extraction.py:530 and result_helpers.py:341.
# Those are de-fanged in the extraction and result-helper waves, and both rules
# turn on in the same commit that fixes them.

[tool.ruff.lint.flake8-bandit]
# The scheduler's random.uniform crawl-delay jitter is throughput shaping, not
# security-sensitive; its S311 finding is suppressed via per-file-ignores below.

[tool.ruff.lint.per-file-ignores]
# Test suites exercise security-sensitive shapes (asserts, fake creds) that
# bandit/bugbear flag; strict hygiene does not apply.
"tests/**" = ["E402", "S", "B", "C901", "PLR0912", "PLR0915"]
# Engine/strategy modules perform deferred heavy imports (optional browser
# bindings) after module-level constants are computed; E402 is deliberate.
# ARG002: _MatchAll.match(path) accepts `path` for surface parity with the other
# robots matcher classes (they dispatch on it) but the empty pattern matches
# every path, so the parameter is intentionally unused.
"app/crawl/engine.py" = ["E402", "S110", "S112", "ARG002"]
# Robustness boundaries: best-effort probes/cleanup where silence is the
# contract (worker reaps, optional-binding probes, webhook best-effort).
"app/api/async_crawl_runner.py" = ["S110", "E402"]
"app/api/webhooks.py" = ["S110"]
# robots single-token matcher constant (not a credential; S105 name heuristic).
"app/constants.py" = ["S105"]
# S310: document.py hands opener.open a urllib Request whose URL comes from
# SafeUrl.connect() -- SafeUrl.parse admits only http/https, so the file:/
# custom-scheme audit is a false positive there (H5 pinned connect).
"app/crawl/strategies/document.py" = ["S310"]
"app/crawl/strategies/http.py" = ["E402", "S110", "S112"]
"app/crawl/strategies/http_client_pool.py" = ["S110"]
"app/crawl/strategies/cookie_jar.py" = ["S110"]
"app/crawl/strategies/fetch_policy.py" = ["S112"]
"app/crawl/strategies/browser.py" = ["S108", "S110", "S112", "E402"]
# browser_pool re-exports BrowserPoolExhaustedError for its existing importers
# (the classifier in result_helpers isinstance-checks it without importing a
# strategy module -- defining it there would cycle); the name is import
# surface, not an unused local.
"app/crawl/strategies/browser_pool.py" = ["F401"]
# The job store wires the sqlite connection factory above the model imports.
# Best-effort snapshot persistence: a failed cache write is never fatal.
"app/crawl/llm_format.py" = ["S110", "S112"]
"app/crawl/fetch_helpers.py" = ["S110", "S112"]

# The str-based Enum style (class Foo(str, Enum)) is the project convention.
"app/**" = ["UP042"]
# The scheduler's jitter is throughput shaping, not crypto (see flake8-bandit note).
"app/scheduler.py" = ["S311"]
"**/__pycache__/**" = ["ALL"]

[tool.pytest.ini_options]
# Mirrors pytest.ini; the actual runner config lives in pytest.ini at the
# repo root so ``pytest`` picks it up automatically.
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -m 'not browser and not slow'"
markers = [
    "browser: launches a real headless browser (Camoufox/Playwright); skipped by default.",
    "slow: takes noticeably longer than the fast default; skipped by default.",
    "integration: exercises cross-module behavior against real servers.",
]
