[build-system]
requires = ["hatchling", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[tool.uv.workspace]
members = ["packages/*"]

[project]
name = "crawlutron"
dynamic = ["version"]
description = "Policy-driven, self-hosted web crawler and content-extraction service built around FastAPI"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "crawlutron maintainers" },
]
keywords = [
    "crawler",
    "scraper",
    "fastapi",
    "browser",
    "ssrf-protection",
    "camoufox",
    "extraction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    # Single source of truth for the runtime dependency set. Exact pins for
    # reproducibility; the transitive graph is frozen by uv.lock.
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "camoufox==0.5.9",
    "curl_cffi==0.17.0",
    "trafilatura==2.3.1",
    "markitdown[pdf,docx,pptx,xlsx]==0.1.9",
    "pdfplumber==0.11.10",
    "charset-normalizer==3.5.2",
    "h2==4.4.1",
    "httpx==0.28.1",
    "brotli==1.2.1",
    "lxml==6.1.3",
    "beautifulsoup4==4.15.0",
    "markdownify==1.2.3",
    "pydantic==2.14.2",
    # Local DBAPI schema migrations only; the package documents no network or telemetry behavior.
    "yoyo-migrations==9.0.0",
    # Bounded-execution regex engine (crawlutron/safety/safe_regex.py): stdlib re cannot be
    # interrupted (GIL wedge) -- correctness/security needs the native timeout.
    "regex==2026.9.29",
    # Public-suffix dataset for registrable_domain (crawlutron/models/registrable_domain.py):
    # without it the suffix heuristic silently degrades.
    "publicsuffixlist==1.1.2.20261101",
]

[project.optional-dependencies]
# Lint and type tools are PINNED, not ranged. These are gates: a floating
# version means a new release can turn a build red with no repository change,
# and the local venv and CI can disagree about what "clean" means. The test
# packages stay ranged — they do not decide pass/fail on their own.
dev = [
    # Test and toolchain packages, exhaustively pinned for reproducible CI and
    # dev installs; uv.lock freezes the transitive graph on top.
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-xdist==3.8.0",
    "pytest-randomly==5.0.0",
    # The hook-chain timeout: the safety-invariants gate runs pytest with
    # --timeout=30 (9x the slowest measured legit invariant), so a hang fails
    # the gate instead of wedging the commit chain. A gate tool, hence pinned
    # exact like the other gates despite living among the test packages.
    "pytest-timeout==2.4.0",
    # Coverage measurement, opt-in only (`make coverage`). No threshold, no
    # fail-under: measurement exists so the number is real; policy is separate.
    "pytest-cov==7.1.0",
    # Coverage engine itself, pinned so the gate surface doesn't float. The
    # dev extra installs it; CI's enforcement job builds from -e .[dev].
    "coverage==7.17.0",
    "ruff==0.17.3",
    "jscpd==5.3.2",
    "pre-commit==4.7.0",
    # Direct consumer: scripts/jscpd_gate.py and scripts/gate_fanout.py parse
    # pre-commit config/JSONC as YAML, and tests/_ci_contract.py parses the CI
    # workflow. It was previously only a transitive dependency of pre-commit.
    "pyyaml==6.0.3",
    # Stubs for the above. Two test modules import `yaml` and mypy cannot type a
    # library it has no stub for, so the import was reported as untyped --
    # which is not the same as untyped, and a reader of that report has to work
    # out the difference. Same reason as the `types-*` entries below.
    "types-PyYAML==6.0.12.20261030",
    # Static type-checking. The crawlutron tree IS mypy-clean (0 errors across 85
    # files) and `typecheck` now runs in CI as a required gate, so this is a
    # real gate, not an advisory one -- the old comment claiming otherwise was
    # stale and would have told the next reader to ignore type errors.
    "brotli-stubs==1.2.1",
    "types-regex==2026.9.29.20261030",
    "types-lxml==2026.2.16",
    "mypy==2.4.1",
    # The third type checker, and the only one that sees annotation lies mypy
    # structurally cannot here. basedpyright (a maintained pyright fork) is the
    # gate: unlike pyright it fails close on a dead include -- a config whose
    # include matches nothing reports "does not exist" and exits 3 instead of
    # passing empty -- so the whole-tree gate cannot silently analyze nothing.
    # Pinned for the same reason as the other gate tools in the extra.
    "basedpyright==1.40.2",
    # Dead-code gate, run by the vulture hook through scripts/gate. Pinned for
    # the same reason as the other gate tools in the extra.
    "vulture==2.16",
]

[project.urls]
# The canonical remote, and the same value as crawlutron.vocabulary.identity.REPOSITORY_URL --
# which is the copy that goes out on the wire in the user-agent. pyproject
# cannot import it, so tests/test_project_urls.py fails if these drift apart.
Homepage = "https://github.com/adambarber/crawlutron"
Issues = "https://github.com/adambarber/crawlutron/issues"
Changelog = "https://github.com/adambarber/crawlutron/blob/main/CHANGELOG.md"
Security = "https://github.com/adambarber/crawlutron/blob/main/SECURITY.md"

[tool.hatch.version]
# The single source of the version: the most recent git tag (SemVer, 0.x per
# #561). Untagged or dirty checkouts get a dev suffix; no hand-edited number.
source = "vcs"

[tool.hatch.build.targets.wheel]
# The root project ships no wheel: it is only the uv workspace container. Every
# importable package (core, rest, the SDK) is a member with its own wheel; the
# SDK gained its own in #898, having shipped from the root until then.
packages = []

# Coverage engine config -- the ONE declaration the pre-push coverage hook and
# any future CI consumer read. `core = "sysmon"` (PEP 669 sys.monitoring) is
# the overhead lever on Python 3.12: tracing via the interpreter's native
# monitoring hooks instead of the C trace function roughly halves the cost of
# the tracer (measured below, see the hook's comment). `branch` stays off for
# the default surface -- statement coverage is the measured number; branch is
# the deeper weekly surface (see the pre-push hook's config comment).
[tool.coverage.run]
core = "sysmon"
branch = false
# The deeper, non-default surface (weekly / pre-release, paired with the
# mutation-proof evidence story): run it by hand with
#   python -m coverage run --branch --dynamic-context=test_function -m pytest -q --cov=crawlutron
#   python -m coverage report --skip-covered --sort=cover
# --dynamic-context needs the tracer started by pytest-cov to record test
# names per line; branch coverage adds arc data on top. Neither is default:
# both cost measurably more than the statement-only sysmon surface.
dynamic_context = false  # the deeper weekly surface enables it via CLI flag

[tool.coverage.report]
# Non-code arcs the tree carries by design; none suppress a real gap.
exclude_lines = [
    "if TYPE_CHECKING:",
    "@overload",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
preview = true
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "C901",
    "PLR0912",
    "PLR0915",
    "RUF100",  # a noqa that no longer suppresses anything
    "PGH004",  # a noqa must name a specific rule, not blanket the file
]
ignore = [
    "D209",  # multiline docstring closing """ stays on the body line (house style)
]

[tool.ruff.lint.isort]
# The crawler moved under packages/core (a uv workspace member), so ``crawlutron``
# is no longer at the repo root and ruff no longer auto-detects it as first-party.
# Naming it keeps isort grouping the package and test trees where it always has,
# rather than re-folded into the third-party block.
known-first-party = ["admission", "crawlutron", "crawlutron_rest", "crawlutron_sdk", "tests", "scripts"]
# PLR0911 (too-many-returns) and PLR0913 (too-many-arguments) are deliberately
# NOT selected, having been measured rather than assumed:
#
#   PLR0913: 55 sites, 6 to 24 arguments, across the API and crawl layers. These
#     are explicit dependency-injection signatures. Adopting the rule would mean
#     bundling 55 of them into parameter objects -- a large refactor of a tested
#     API surface whose only effect is to make the dependencies less visible at
#     the call site. That is a style preference, not a defect signal.
#   PLR0911: 11 sites, 7 to 18 returns, in 9 production modules. Every one is
#     dispatch-shaped (validation, extraction, JSON coercion) where early returns
#     are the clear form; satisfying the rule would mean accumulating into a
#     variable purely to satisfy a count.
#
# Both are recorded here so the omission reads as a decision rather than a gap.
# Until 2026-11-02 there was no `ignore` list: E302/E303/E306/E117/W391/B903
# were removed once the tree was clean of them, so an entry cost more to keep
# than to notice. E501 was exempted as "handled by formatter" while no formatter
# ran in any gate, so 154 over-length lines went unenforced; S101 was exempted
# while `tests/**` already carried the `S` family, masking 8 asserts as collateral.
#
# The single exception now: D209 (ignore, above). Every other rule the D-family
# would raise is deliberately unselected rather than ignored, because the D209
# rewrite alone was measured at 1,153 docstring churn lines across 294 files.
#
# The principle this replaces: a suppression that suppresses nothing is a claim
# about the code that nothing re-checks. The type-suppression half of that is
# already enforced -- mypy runs `warn_unused_ignores` and pyrightconfig sets
# `reportUnnecessaryTypeIgnoreComment: "error"` -- and the style half now has
# RUF100 and PGH004 selected below, so a noqa that no longer earns its place
# fails the build rather than accumulating.
#
# `ruff format --check` runs as a hook beside `ruff check`. E501 is enforced
# and the tree carries zero inline suppressors: every former suppression was
# paid for by shortening or reflowing the offending lines, and the #638 wave
# cleared the rest (test doubles, admission harnesses, registry imports). The
# whole-tree assertion lives in tests/invariants/test_no_inline_suppressions.py,
# which scans crawlutron/ and tests/ token-precisely and fails naming file+line.
# RUF100 remains selected, so any future inline suppression that suppresses
# nothing is itself a lint error -- and PGH004 forces any that does suppress to
# name its rule.
#
# B008: FastAPI dependency injection passes Depends(...) as a default argument
# by design; calls listed here are recognized as immutable by bugbear.
# S311: random.uniform jitter in the scheduler is throughput shaping, not crypto.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "Depends",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Body",
    "fastapi.Header",
]

# Complexity ratchets. These are 10% UNDER the worst offender in crawlutron/ at the time
# of writing, not round numbers, because a round number is a number nobody
# re-derived: the point is that every threshold names a function that exists and
# is still too big. Measure with
#   ruff check --isolated --preview --select C901,PLR0912,PLR0915 --output-format concise crawlutron
# and take the top value per rule; read it as the CURRENT worst.
#
# The thresholds ship with the refactor that brought the tree under them, not
# after it. Setting them above the pre-refactor worst would let the next wave
# start already red, which trains people to expect red and to re-baseline it.
#
# History: 42 / 46 / 164 before the HTTP subsystem split. The split took
# _http_strategy_result (the 164-statement monolith) to 5 / 4 / 17, which left
# _run_job as the worst offender at 30 / 31 / 87, so the thresholds came down to
# exactly that. Lowering them here rather than later is the rule: a ratchet that
# waits for a cleanup phase is a ratchet nobody pulls.
#
# Each tightening hands the next wave its target for free. _run_job is the
# subject of the job-runner split, and when it comes down the next-worst moves
# again, so this block is expected to keep coming down.
[tool.ruff.lint.mccabe]
max-complexity = 30

[tool.ruff.lint.pylint]
max-branches = 31
max-statements = 87
# PLR0911 (returns) and PLR0913 (arguments) are still unselected. Their maxima
# are 10 and 24, against the 9 and 21 that a 10%-under ratchet would demand, and
# both are exceeded by the same handful of long functions, the largest being
# crawlutron/runtime/metrics.py's `_exposition` and crawlutron/main.py's `_lifespan`, which the
# orchestration and extractor waves split. Both rules turn on in the same commit
# that brings those functions under the ratchet.

[tool.ruff.lint.per-file-ignores]
# rules that cannot apply to a pytest suite at all. Each directory that carries
# exemptions declares its own, so a rule relaxed for tests is not silently relaxed for
# the scripts tree as well.
#
# Each was a blanket family mute -- "S" and "B" disabled all 30-odd bandit and
# bugbear rules for the whole test tree, including the ones that catch real
# defects in test code (a `subprocess(..., shell=True)`, a hardcoded credential
# that is not a fixture). They are now named rules, so a test that grows an
# `eval` fails the build and one that asserts still does not.
    "tests/**" = [
    "S101",    # assert IS the test mechanism; this is not a bypass
    "S104",    # 0.0.0.0 appears as the address a test asserts is BLOCKED, or as
               # a bind the settings layer is asserted to accept -- never as a
               # bind this code performs
    "S105",    # fake credentials in fixtures
    "S106",    # fake credentials in fixtures
    "S311",    # seeded pseudo-random generators, for reproducible test data.
               # Not satisfiable by any change: the rule fires on the
               # random.Random(seed) CONSTRUCTION, not just on its methods, so
               # every seeded fixture and every property sweep trips it
    "S404",    # importing subprocess is not itself the risk. The risks live at
               # the call site, and the two that can be satisfied are: S607 is
               # satisfied by scripts/executables.require_executable, and S602
               # (shell=True) is enforced here with no exemption at all
    "S603",    # fires whenever a command element is not a string literal, which
               # is every call passing a resolved executable or a runtime path.
               # Verified against ruff 0.16.8: a fully-literal argv is clean even
               # with cwd=, so this is the 12 unavoidable call sites, not a mute
    "S608",    # the interpolated identifiers are SQL identifiers, which cannot
               # be bound as parameters. They come from PRAGMA table_info and
               # the schema enum -- never from input -- and every value on these
               # same queries is still bound with ?
    "C901",    # a test body that spells out one long scenario
    "PLR0912",
    "PLR0915",
]
# A per-package test home under packages/*/tests/ is ruff's own test surface too
# (#908): the S-family's assert/exe rules, and the complexity ratchets, apply no
# more to a moved test than to a flat one. Keep the set identical to tests/** so
# a behavior-equivalent test is lint-clean in either home.
"packages/*/tests/**" = [
    "S101",
    "S104",
    "S105",
    "S106",
    "S311",
    "S404",
    "S603",
    "S608",
    "C901",
    "PLR0912",
    "PLR0915",
]
# `scripts/extract_comments.py` is the one script that spawns a process, and
# it is the same pair the tests carry, for the same reason: importing
# subprocess is not the risk, and the resolved executable is a path rather than
# input. It resolves git with `shutil.which` and takes its documented rglob
# fallback when git is absent, so it neither needs git nor passes a shell.
"scripts/**" = [
    "S404",
    "S603",
]
# crawlutron_rest/cli/docker.py shells out to the docker CLI to start the service
# (crawl up, Spike A, issue #710). The argv is built from the operator's explicit
# --image/--tag (never caller input, never credentials), so importing and invoking
# subprocess is intentional, not a bypassable sink.
"packages/rest/src/crawlutron_rest/cli/docker.py" = [
    "S404",  # intentional: the docker CLI is the only way to start the service
    "S603",  # intentional: argv is operator-supplied image/tag, never caller credentials
]
"**/__pycache__/**" = ["ALL"]
