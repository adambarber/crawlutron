[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-crawler"
version = "0.2.0"
description = "Policy-driven, self-hosted web crawler and content-extraction service built around FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "browser-crawler maintainers" },
]
keywords = [
    "crawler",
    "scraper",
    "fastapi",
    "browser",
    "ssrf-protection",
    "camoufox",
    "extraction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "fastapi>=0.124",
    "uvicorn[standard]>=0.38",
    "camoufox[asyncio]>=0.3.0",
    "curl_cffi>=0.7.0",
    "trafilatura>=2.0",
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.0",
    "pdfplumber>=0.11.0",
    "charset-normalizer>=3.3.0",
    "h2>=4.1.0",
    "httpx>=0.27.0",
    "brotli>=1.1.0",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.10",
    "pytest-xdist>=3.0",
    "pytest-randomly>=4.0",
    "ruff>=0.5",
]

[project.urls]
# TODO: replace placeholder org before publishing (currently dev-stack private).
Homepage = "https://github.com/browser-crawler/browser-crawler"
Issues = "https://github.com/browser-crawler/browser-crawler/issues"
Changelog = "https://github.com/browser-crawler/browser-crawler/blob/main/CHANGELOG.md"
Security = "https://github.com/browser-crawler/browser-crawler/blob/main/SECURITY.md"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
]
ignore = [
    "E501",  # line length (handled by formatter)
    "S101",  # use of assert (acceptable in tests)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
"app/api/**" = ["B008"]
"app/main.py" = ["B008"]
"**/__pycache__/**" = ["ALL"]

[tool.pytest.ini_options]
# Mirrors pytest.ini; the actual runner config lives in pytest.ini at the
# repo root so ``pytest`` picks it up automatically.
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers -m 'not browser and not slow'"
markers = [
    "browser: launches a real headless browser (Camoufox/Playwright); skipped by default.",
    "slow: takes noticeably longer than the fast default; skipped by default.",
    "integration: exercises cross-module behavior against real servers.",
]
